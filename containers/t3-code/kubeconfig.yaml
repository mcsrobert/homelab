---
# Default context for the pod's service account. kubectl only falls back to
# in-cluster credentials without a kubeconfig and with no connection flags
# such as --request-timeout; otherwise it tries localhost:8080.
apiVersion: v1
kind: Config
clusters:
  - name: homelab
    cluster:
      server: https://kubernetes.default.svc
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
users:
  - name: t3-code
    user:
      # Read on use, so it follows the projected token's rotation.
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
contexts:
  - name: homelab
    context:
      cluster: homelab
      user: t3-code
current-context: homelab
