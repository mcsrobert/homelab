---
# Connection flags such as --request-timeout can make kubectl skip in-cluster credentials.
apiVersion: v1
kind: Config
clusters:
  - name: homelab
    cluster:
      server: https://kubernetes.default.svc
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
users:
  - name: t3-code
    user:
      # tokenFile follows projected token rotation.
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
contexts:
  - name: homelab
    context:
      cluster: homelab
      user: t3-code
current-context: homelab
