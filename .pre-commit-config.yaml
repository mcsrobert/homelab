---
default_install_hook_types: ["pre-commit", "pre-push", "commit-msg"]
default_language_version:
  node: lts

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending

  - repo: https://github.com/sirosen/texthooks
    rev: 1.0.0
    hooks:
      - id: fix-smartquotes
      - id: fix-spaces
      - id: fix-unicode-dashes

  - repo: https://github.com/k8s-at-home/sops-pre-commit
    rev: v2.1.1
    hooks:
      - id: forbid-secrets

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.173.1
    hooks:
      - id: renovate-config-validator
        files: "renovate(rc|/.+)?\\.json5?$"

  # See: https://github.com/ansible/ansible-lint/discussions/1256
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.11.0
    hooks:
      - id: ansible-lint
        # Git sets GIT_DIR for hooks run from a worktree, which leaks into
        # ansible-galaxy's clone of k3s-ansible and breaks its checkout.
        entry: env -u GIT_DIR ansible-lint
        args:
          - ansible/
        stages: ["pre-push", "manual"]

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false

      - id: zizmor
        name: zizmor
        entry: zizmor --offline
        language: system
        files: ^(\.github/(workflows|actions)/.+\.ya?ml|\.pre-commit-config\.yaml)$

      - id: flate-test
        name: flate test
        entry: bash scripts/flate.sh test all --path kubernetes
        language: system
        files: ^(kubernetes/|scripts/flate\.sh$|\.pre-commit-config\.yaml$|mise\.toml$)
        pass_filenames: false
        stages: ["pre-push", "manual"]

      - id: conventional-commit
        name: conventional commit with scope
        entry: '\A(Merge |Revert "|(fixup|squash)! |(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(!?\([A-Za-z0-9._/-]+\)!?): \S)'
        language: pygrep
        args: ["--multiline", "--negate"]
        stages: ["commit-msg"]
