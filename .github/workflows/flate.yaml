---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate
on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.8.0

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      any_changed: ${{ steps.filter.outputs.kubernetes }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter Files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            kubernetes:
              - 'kubernetes/**'

  flate-test:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.any_changed == 'true' }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          cache: true

      - name: Run flate test
        run: |
          unset FLATE_BASE  # TODO: Remove once flate v0.7.0 lands (home-operations/flate#1148)
          flate test all --path kubernetes

  flate-diff:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resources: ["hr", "ks"]
      max-parallel: 4
      fail-fast: false
    if: ${{ needs.changes.outputs.any_changed == 'true' }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          cache: true

      - name: Run flate diff
        id: diff
        continue-on-error: true  # TODO: Remove once flate v0.7.0 lands (home-operations/flate#1148)
        run: |
          flate diff ${{ matrix.resources }} \
            --path kubernetes \
            --output github > "$RUNNER_TEMP/diff.txt"

          if [ -s "$RUNNER_TEMP/diff.txt" ]; then
            # GitHub comments are capped at 65,536 characters
            {
              echo '```diff'
              head -c 65000 "$RUNNER_TEMP/diff.txt"
              echo
              echo '```'
            } > "$RUNNER_TEMP/comment.md"
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Comment
        if: ${{ steps.diff.outputs.has_diff == 'true' }}
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12
        continue-on-error: true
        with:
          message-id: ${{ github.event.pull_request.number }}/${{ matrix.resources }}
          message-failure: Diff was not successful
          message-path: ${{ runner.temp }}/comment.md

  kubeconform:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.any_changed == 'true' }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # FLATE_BASE=main needs origin/main to resolve
          persist-credentials: false

      - name: Setup Flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          cache: true

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run kubeconform
        run: |
          set -o pipefail
          unset FLATE_BASE  # TODO: Remove once flate v0.7.0 lands (home-operations/flate#1148)
          flate build all --path kubernetes --no-progress \
            --api-versions gateway.networking.k8s.io/v1/HTTPRoute \
            | sed -E 's/\.\.PLACEHOLDER_[A-Z0-9_]+\.\./placeholder.example.com/g' \
            | kubeconform \
              -strict \
              -summary \
              -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -schema-location 'https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/{{.ResourceKind}}.json'
