---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Builds and smoke tests the T3 Code image from containers/t3-code for pull
# requests, with a read-only token. t3-code-image-publish.yaml publishes it.
# The image bakes the baseline tools from mise.toml, so changes to them rebuild.
name: T3 Code Image
on: workflow_call

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      any_changed: ${{ steps.changes.outputs.changed }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The checkout is the PR's merge commit, whose first parent is the base.
      - name: Check for image changes
        id: changes
        run: echo "changed=$(bash containers/t3-code/image-changed.sh HEAD^1)" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: ${{ needs.changes.outputs.any_changed == 'true' }}
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default docker driver cannot rewrite timestamps while it loads
      # the image, so use the same builder as the publish workflow.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/t3-code/Dockerfile
          platforms: linux/arm64
          secrets: github_token=${{ github.token }}
          # Rewrite timestamps as the publish workflow does. The image has no
          # provenance or SBOM and is loaded locally instead of pushed.
          outputs: type=docker,rewrite-timestamp=true
          provenance: false
          tags: t3-code:test

      - name: Smoke test
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: bash containers/t3-code/smoke-test.sh t3-code:test
