---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate Soak
on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: soak-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  renovate-soak:
    if: github.actor == 'renovatebot-mcsrobert[bot]'
    runs-on: ubuntu-latest
    environment: soak-6d
    steps:
      - name: Run Soak Test
        run: echo "Soaked at $(date)"
