---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint
on: push

permissions:
  contents: read

# Pin every linter, so results only change through a commit (and the linters
# re-run on it, see the filters below). The toolchain they run on (Python, uv
# and ansible) comes from mise.toml.
env:
  # renovate: datasource=pypi depName=ansible-lint
  ANSIBLE_LINT_VERSION: 26.10.1
  # renovate: datasource=pypi depName=yamllint
  YAMLLINT_VERSION: 1.38.0

jobs:

  changes:
    runs-on: ubuntu-latest
    outputs:
      ansible: ${{ steps.filter.outputs.ansible }}
      # kubernetes: ${{ steps.filter.outputs.kubernetes }}
      # kubernetes_files: ${{ steps.filter.outputs.kubernetes_files }}
      markdown: ${{ steps.filter.outputs.markdown }}
      markdown_config: ${{ steps.filter.outputs.markdown_config }}
      markdown_files: ${{ steps.filter.outputs.markdown_files }}
      yaml: ${{ steps.filter.outputs.yaml }}
      yaml_config: ${{ steps.filter.outputs.yaml_config }}
      yaml_files: ${{ steps.filter.outputs.yaml_files }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter Files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          list-files: shell
          # Changes to this workflow (linter versions) or to a linter's
          # config re-run that linter against the whole repository.
          filters: |
            workflow: &workflow
              - '.github/workflows/lint.yaml'
            toolchain: &toolchain
              - 'mise.toml'
            ansible:
              - *workflow
              - *toolchain
              - 'ansible/**'
            kubernetes:
              - added|modified: 'kubernetes/**'
            markdown:
              - added|modified: '**/*.md'
            markdown_config:
              - *workflow
              - '.markdownlint.json'
            yaml:
              - added|modified: '**/*.yaml'
              - added|modified: '**/*.yml'
            yaml_config:
              - *workflow
              - *toolchain
              - '.yamllint.yaml'

  ansible-lint:
    needs: changes
    if: ${{ needs.changes.outputs.ansible == 'true' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not using the ansible/ansible-lint action: it leaves ansible-core and
      # its other dependencies unpinned, resolving the latest on every run.
      - name: Setup mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: python uv

      # Install into one environment with the ansible version from mise.toml,
      # as ansible-lint imports ansible-core.
      - name: Install ansible-lint
        run: |
          uv tool install \
            --python "$(mise which python)" \
            --with "ansible==$(mise current ansible)" \
            --with-executables-from ansible-core \
            "ansible-lint==${ANSIBLE_LINT_VERSION}"
          uv tool dir --bin >> "${GITHUB_PATH}"

      - name: Run ansible-lint
        working-directory: ansible
        run: |
          ansible-lint --version
          ansible-lint

  # TODO: Should probably run on the output of flux local
  # kubeconform:
  #   needs: changes
  #   if: ${{ needs.changes.outputs.kubernetes == 'true' }}
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - name: Run kubeconform
  #       uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
  #       with:
  #         entrypoint: /kubeconform
  #         args: >-
  #           -output json
  #           -summary
  #           -schema-location default
  #           -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
  #           -schema-location https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/{{.ResourceKind}}.json
  #           -ignore-filename-pattern resources/
  #           -ignore-filename-pattern helmfile\.ya?ml
  #           -ignore-filename-pattern helm-values\.ya?ml
  #           -ignore-filename-pattern transformer-config\.ya?ml
  #           -skip gateway.networking.k8s.io/v1/HTTPRoute
  #           ${{ needs.changes.outputs.kubernetes_files }}

  markdownlint:
    needs: changes
    if: ${{ needs.changes.outputs.markdown == 'true' || needs.changes.outputs.markdown_config == 'true' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: ${{ needs.changes.outputs.markdown_config == 'true' && '**/*.md' || needs.changes.outputs.markdown_files }}
          separator: ' '

  yamllint:
    needs: changes
    if: ${{ needs.changes.outputs.yaml == 'true' || needs.changes.outputs.yaml_config == 'true' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: python uv

      - name: Install yamllint
        run: |
          uv tool install --python "$(mise which python)" "yamllint==${YAMLLINT_VERSION}"
          uv tool dir --bin >> "${GITHUB_PATH}"

      - name: Run yamllint
        env:
          LINT_ALL: ${{ needs.changes.outputs.yaml_config }}
          YAML_FILES: ${{ needs.changes.outputs.yaml_files }}
        run: |
          if [[ "${LINT_ALL}" == "true" ]]; then
            yamllint .
          else
            # Files are shell-escaped by paths-filter; xargs unquotes them.
            echo "${YAML_FILES}" | xargs yamllint
          fi
