---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: T3 Code Image Publish
on:
  push:
    branches:
      - main
    paths:
      - containers/t3-code/**
      - mise.toml
      - .github/workflows/t3-code-image-publish.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DIR: containers/t3-code
  IMAGE: ghcr.io/${{ github.repository_owner }}/t3-code

jobs:
  changes:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for image changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $EVENT == push ]]; then
            changed=$(bash "$DIR/image-changed.sh" "$BEFORE")
          else
            changed=true
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

  publish:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read versions
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          arg() { sed -n "s/^ARG $1=v//p" "$DIR/Dockerfile"; }
          dependency() { jq -er --arg name "$1" '.dependencies[$name]' "$DIR/package.json"; }
          baseline=$(python3 -I "$DIR/baseline-tools.py")
          baseline=$(sed 's/=/ /g; s/ \([^ ]*\) / \1, /g' <<< "$baseline")
          t3code=$(arg T3CODE_VERSION)
          [[ $t3code =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected T3 Code version '${t3code}'"; exit 1; }
          {
            echo "version=${t3code}.${RUN_NUMBER}"
            echo "description=T3 Code ${t3code} with mise $(arg MISE_VERSION), gh $(arg GH_VERSION), Claude Code $(dependency @anthropic-ai/claude-code) and Codex $(dependency @openai/codex), plus ${baseline} from mise.toml"
          } >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=T3 Code
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=${{ steps.version.outputs.description }}
          annotations: |
            org.opencontainers.image.title=T3 Code
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=${{ steps.version.outputs.description }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reruns reuse the run number. Only an explicit not-found permits publishing the tag.
      - name: Check that the version is new
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if output=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>&1); then
            echo "::error::${IMAGE}:${VERSION} already exists. Start a new run instead of re-running this one."
            exit 1
          elif [[ $output != *": not found"* ]]; then
            echo "::error::Could not check whether ${IMAGE}:${VERSION} exists: ${output}"
            exit 1
          fi

      # Defer tagging until the pushed digest passes smoke tests and is attested.
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DIR }}/Dockerfile
          platforms: linux/arm64
          secrets: github_token=${{ github.token }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,compression=zstd,compression-level=9,force-compression=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Smoke test
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash "$DIR/smoke-test.sh" "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # One source and no new annotations preserve the tested index digest.
      - name: Tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do
            [[ -n $tag ]] && args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
          DESCRIPTION: ${{ steps.version.outputs.description }}
        run: |
          {
            echo "Published \`${IMAGE}:${VERSION}@${DIGEST}\`"
            echo
            echo "${DESCRIPTION}"
          } >> "$GITHUB_STEP_SUMMARY"
