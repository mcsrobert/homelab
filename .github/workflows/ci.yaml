---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI
on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yaml

  flate:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/flate.yaml

  security:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/security.yaml

  ha-reconciler:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test capture, decisions and deployment recovery
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -p test_ha_reconciler.py -v

  ci:
    if: ${{ always() }}
    needs: ["lint", "flate", "security", "ha-reconciler"]
    runs-on: ubuntu-26.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "Failed: ${RESULTS}"
              exit 1
            fi
          done
