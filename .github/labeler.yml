---
area/ansible:
  - changed-files:
      - any-glob-to-any-file:
          - ansible/**

area/ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .pre-commit-config.yaml
          - .yamllint.yaml
          - .markdownlint.json
          - .github/zizmor.yml
          - .gitleaks.toml
          - .gitleaksignore

area/network:
  - changed-files:
      - any-glob-to-any-file:
          - kubernetes/apps/network/**
          - kubernetes/apps/cert-manager/**
          - kubernetes/apps/kube-system/gateway-api/**

area/storage:
  - changed-files:
      - any-glob-to-any-file:
          - kubernetes/apps/longhorn-system/**
          - kubernetes/apps/default/garage/**
          - kubernetes/apps/**/scheduled-backup.yaml

kind/documentation:
  - changed-files:
      - all-globs-to-all-files:
          - "**/*.md"

area/security:
  - changed-files:
      - any-glob-to-any-file:
          - kubernetes/apps/security/**
          - .github/workflows/security.yaml
          - .github/zizmor.yml
          - .gitleaks.toml
          - .gitleaksignore

area/observability:
  - changed-files:
      - any-glob-to-any-file:
          - kubernetes/apps/observability/**
