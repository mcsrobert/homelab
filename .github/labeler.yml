---
ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .pre-commit-config.yaml
          - .yamllint.yaml
          - .markdownlint.json
          - .github/zizmor.yml
          - .gitleaks.toml
          - .gitleaksignore

documentation:
  - changed-files:
      - all-globs-to-all-files:
          - "**/*.md"

security:
  - changed-files:
      - any-glob-to-any-file:
          - kubernetes/apps/security/**
          - .github/workflows/security.yaml
          - .github/zizmor.yml
          - .gitleaks.toml
          - .gitleaksignore

observability:
  - changed-files:
      - any-glob-to-any-file:
          - kubernetes/apps/observability/**
