---
- name: Wait for Deployments to be ready
  delegate_to: localhost
  become: false
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
  register: workload_status
  vars: &workloads_not_ready
    workloads_not_ready: >-
      {%- set not_ready = namespace(names=[]) %}
      {%- for workload in workload_status.resources | default([]) %}
      {%- if workload.status.readyReplicas | default(0) < workload.spec.replicas | default(1) %}
      {%- set not_ready.names = not_ready.names + [workload.metadata.namespace ~ '/' ~ workload.metadata.name] %}
      {%- endif %}
      {%- endfor %}
      {{- not_ready.names -}}
  failed_when: false
  until: &workloads_ready workload_status.resources is defined and workloads_not_ready | length == 0
  retries: 40
  delay: 15

- name: Fail if Deployments are not ready
  vars: *workloads_not_ready
  ansible.builtin.assert:
    that: *workloads_ready
    fail_msg: >-
      Deployments not ready: {{ workloads_not_ready | join(', ') }}
      {{ workload_status.msg | default('') }}

- name: Wait for StatefulSets to be ready
  delegate_to: localhost
  become: false
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
  register: workload_status
  vars: *workloads_not_ready
  failed_when: false
  until: *workloads_ready
  retries: 40
  delay: 15

- name: Fail if StatefulSets are not ready
  vars: *workloads_not_ready
  ansible.builtin.assert:
    that: *workloads_ready
    fail_msg: >-
      StatefulSets not ready: {{ workloads_not_ready | join(', ') }}
      {{ workload_status.msg | default('') }}

- name: Wait for CloudNativePG clusters to be ready
  delegate_to: localhost
  become: false
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
  register: database_status
  vars: &databases_not_ready
    databases_not_ready: >-
      {%- set not_ready = namespace(names=[]) %}
      {%- for database in database_status.resources | default([]) %}
      {%- if database.status.readyInstances | default(0) < database.spec.instances | default(1) %}
      {%- set not_ready.names = not_ready.names + [database.metadata.namespace ~ '/' ~ database.metadata.name] %}
      {%- endif %}
      {%- endfor %}
      {{- not_ready.names -}}
  failed_when: false
  until: &databases_ready database_status.api_found | default(false) and databases_not_ready | length == 0
  retries: 40
  delay: 15

- name: Fail if CloudNativePG clusters are not ready
  vars: *databases_not_ready
  ansible.builtin.assert:
    that: *databases_ready
    fail_msg: >-
      CloudNativePG clusters not ready: {{ databases_not_ready | join(', ') }}
      {{ '' if database_status.api_found | default(false) else 'Cluster API not found.' }}
      {{ database_status.msg | default('') }}
