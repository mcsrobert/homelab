---
# First match wins. Keep request and response bodies out of the audit log.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  - level: None
    userGroups: ["system:nodes"]
  - level: None
    users:
      - system:apiserver
      - system:kube-proxy
      - system:kube-scheduler

  - level: Metadata
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward"]

  - level: None
    nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/version", "/metrics"]

  - level: None
    resources:
      - group: ""
        resources: ["events", "endpoints", "nodes/status", "pods/status"]
      - group: coordination.k8s.io
        resources: ["leases"]
      - group: discovery.k8s.io
        resources: ["endpointslices"]

  # Audit Secret reads before the general read exclusion.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets"]

  - level: None
    verbs: ["get", "list", "watch"]

  # Metadata captures Pod Security Admission audit annotations.
  - level: Metadata
