---
# Keep preflight outside the serial play so every node is checked before any upgrade.
- name: Validate the controller before upgrading any host
  hosts: k3s_cluster
  gather_facts: false
  become: false
  any_errors_fatal: true
  module_defaults: &kubernetes_defaults
    group/kubernetes.core.k8s:
      context: "{{ cluster_context }}"
      kubeconfig: "{{ lookup('env', 'HOME') ~ '/.kube/config' }}"

  tasks:

    - name: Check that the controller can reach the node
      delegate_to: localhost
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        name: "{{ inventory_hostname }}"
      register: preflight_node
      failed_when: false
      until: preflight_node.resources is defined
      retries: 5
      delay: 10

    - name: Fail if the cluster is unreachable or lacks this node
      ansible.builtin.assert:
        that:
          - preflight_node.resources | default([]) | length > 0
        fail_msg: >-
          The kubeconfig context "{{ cluster_context }}" cannot reach the cluster
          or has no node named {{ inventory_hostname }}:
          {{ preflight_node.msg | default('node not found') }}

    # Pods pinned to a node an interrupted run left cordoned cannot become ready, so
    # the readiness checks would time out on another node before reaching it.
    - name: Recover nodes left cordoned by an interrupted run
      run_once: true  # noqa: run-once[task]
      delegate_to: localhost
      vars:
        marked_nodes: >-
          {{ marked_nodes_status.resources | default([])
             | map(attribute='metadata') | selectattr('annotations', 'defined')
             | selectattr('annotations.homelab/apt-upgrade-cordon', 'defined')
             | selectattr('annotations.homelab/apt-upgrade-cordon', 'eq', 'true')
             | map(attribute='name') | list }}
        marked_nodes_not_ready: >-
          {%- set not_ready = namespace(names=[]) %}
          {%- for node in marked_nodes_status.resources | default([]) %}
          {%- if node.metadata.name in marked_nodes
                and node.status.conditions | default([])
                    | selectattr('type', 'eq', 'Ready')
                    | selectattr('status', 'eq', 'True') | list | length == 0 %}
          {%- set not_ready.names = not_ready.names + [node.metadata.name] %}
          {%- endif %}
          {%- endfor %}
          {{- not_ready.names -}}
      block:

        - name: Wait for nodes left cordoned by an interrupted run to be Ready
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Node
          register: marked_nodes_status
          failed_when: false
          until: &marked_nodes_ready marked_nodes_status.resources is defined and marked_nodes_not_ready | length == 0
          retries: 30
          delay: 10

        - name: Fail if a node left cordoned by an interrupted run is not Ready
          ansible.builtin.assert:
            that: *marked_nodes_ready
            fail_msg: >-
              Nodes left cordoned by an interrupted upgrade are not Ready:
              {{ marked_nodes_not_ready | join(', ') }}. Bring them back, or remove their
              homelab/apt-upgrade-cordon annotation to keep them cordoned, then rerun.
              {{ marked_nodes_status.msg | default('') }}

        - name: Uncordon nodes left cordoned by an interrupted run
          kubernetes.core.k8s_drain:
            name: "{{ item }}"
            state: uncordon
          loop: "{{ marked_nodes }}"
          register: marked_nodes_uncordon
          until: marked_nodes_uncordon is not failed
          retries: 5
          delay: 10

        - name: Remove the playbook cordon marker from the recovered nodes
          kubernetes.core.k8s:
            state: patched
            merge_type: merge
            definition:
              apiVersion: v1
              kind: Node
              metadata:
                name: "{{ item }}"
                annotations:
                  homelab/apt-upgrade-cordon: null
          loop: "{{ marked_nodes }}"
          register: marked_nodes_clear_marker
          until: marked_nodes_clear_marker is not failed
          retries: 5
          delay: 10

- name: Upgrade remote host
  hosts: k3s_cluster
  become: true
  serial: 1
  module_defaults: *kubernetes_defaults

  pre_tasks:

    - name: Update apt repo and cache
      ansible.builtin.apt:
        update_cache: true

  tasks:

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true

    # Armbian can rebuild the kernel without changing uname -r.
    - name: Find kernel packages installed since the last boot
      ansible.builtin.shell: >-
        find /var/lib/dpkg/info -maxdepth 1
        -name 'linux-image-*.list' -size +1k
        -newermt "$(uptime -s)"
      register: new_kernel_packages
      changed_when: false
      check_mode: false

    - name: Read the node before upgrading it
      when: &reboot_due new_kernel_packages.stdout | length > 0
      delegate_to: localhost
      become: false
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        name: "{{ inventory_hostname }}"
      register: current_node

    # The marker is only still present in check mode, where preflight cannot remove it.
    - name: Remember whether the node was cordoned before the upgrade
      when: *reboot_due
      ansible.builtin.set_fact:
        node_was_cordoned: >-
          {{ (current_node.resources | first).spec.unschedulable | default(false)
             and ((current_node.resources | first).metadata.annotations | default({}))
                 .get('homelab/apt-upgrade-cordon') != 'true' }}

    # A drain keeps the operator cordon, so pods whose volumes pin them to this node
    # could not be scheduled anywhere and the checks after the reboot would never pass.
    - name: Check for workloads pinned to the operator-cordoned node
      when:
        - *reboot_due
        - node_was_cordoned
      delegate_to: localhost
      become: false
      block:

        - name: List pods on the operator-cordoned node
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            field_selectors:
              - "spec.nodeName={{ inventory_hostname }}"
          register: cordoned_node_pods

        - name: List PersistentVolumeClaims
          kubernetes.core.k8s_info:
            api_version: v1
            kind: PersistentVolumeClaim
          register: cordoned_node_claims

        - name: List PersistentVolumes
          kubernetes.core.k8s_info:
            api_version: v1
            kind: PersistentVolume
          register: cordoned_node_volumes

        - name: List Longhorn volumes
          kubernetes.core.k8s_info:
            api_version: longhorn.io/v1beta2
            kind: Volume
            namespace: longhorn-system
          register: cordoned_node_longhorn_volumes

        - name: Fail if draining would strand workloads pinned to the node
          ansible.builtin.assert:
            that:
              - pinned_workloads | length == 0
            fail_msg: >-
              {{ inventory_hostname }} was cordoned by the operator and runs pods whose
              volumes pin them to it: {{ pinned_workloads | join(', ') }}. Draining would
              leave them unschedulable while the node stays cordoned. Uncordon the node so
              the upgrade manages its cordon, or move or stop these workloads, then rerun.
          vars:
            pinned_workloads: >-
              {%- set strict_local = cordoned_node_longhorn_volumes.resources | default([])
                  | selectattr('spec.dataLocality', 'defined')
                  | selectattr('spec.dataLocality', 'eq', 'strict-local')
                  | map(attribute='metadata.name') | list %}
              {%- set pinned = namespace(names=[]) %}
              {%- for pod in cordoned_node_pods.resources | default([]) %}
              {%- set owners = pod.metadata.ownerReferences | default([]) | map(attribute='kind') | list %}
              {%- if 'DaemonSet' not in owners
                    and 'kubernetes.io/config.mirror' not in (pod.metadata.annotations | default({}))
                    and pod.status.phase | default('') not in ['Succeeded', 'Failed'] %}
              {%- for volume in pod.spec.volumes | default([]) | selectattr('persistentVolumeClaim', 'defined') %}
              {%- set claim = cordoned_node_claims.resources | default([])
                  | selectattr('metadata.namespace', 'eq', pod.metadata.namespace)
                  | selectattr('metadata.name', 'eq', volume.persistentVolumeClaim.claimName)
                  | first | default({}) %}
              {%- set volume_spec = (cordoned_node_volumes.resources | default([])
                  | selectattr('metadata.name', 'eq', (claim.spec | default({})).volumeName | default(''))
                  | first | default({})).spec | default({}) %}
              {%- set csi = volume_spec.csi | default({}) %}
              {%- if volume_spec.nodeAffinity is defined
                    or (csi.driver | default('') == 'driver.longhorn.io'
                        and csi.volumeHandle | default('') in strict_local) %}
              {%- set pinned.names = pinned.names
                  + [pod.metadata.namespace ~ '/' ~ pod.metadata.name
                     ~ ' (' ~ volume.persistentVolumeClaim.claimName ~ ')'] %}
              {%- endif %}
              {%- endfor %}
              {%- endif %}
              {%- endfor %}
              {{- pinned.names -}}

    - name: Wait for Longhorn before draining
      when: *reboot_due
      ansible.builtin.include_tasks: tasks/wait_for_longhorn.yaml

    - name: Wait for workloads before draining
      when: *reboot_due
      ansible.builtin.include_tasks: tasks/wait_for_workloads.yaml

    - name: Drain and reboot the node
      when: *reboot_due
      block:

        - name: Warn that the operator cordon will be preserved
          ansible.builtin.debug:
            msg: >-
              WARNING: {{ inventory_hostname }} was cordoned by the operator
              and will intentionally be left cordoned after this upgrade.
          when: node_was_cordoned

        - name: Mark the cordon as owned by this playbook
          delegate_to: localhost
          become: false
          kubernetes.core.k8s:
            state: patched
            merge_type: merge
            definition:
              apiVersion: v1
              kind: Node
              metadata:
                name: "{{ inventory_hostname }}"
                annotations:
                  homelab/apt-upgrade-cordon: "true"
          when: not node_was_cordoned

        - name: Reset drain attempts
          ansible.builtin.set_fact:
            node_drain_attempt: 0

        # k8s_drain can succeed with pods still running after wait_timeout.
        - name: Drain node before reboot
          ansible.builtin.include_tasks: tasks/drain_node.yaml
          vars:
            node_drain_retries: 3
            node_drain_delay: 30

        # An unreachable host skips rescue. Ignore that status and fail explicitly to run rescue.
        - name: Reboot node
          ansible.builtin.reboot:
            msg: Reboot initiated by Ansible after package upgrades
            connect_timeout: 5
            reboot_timeout: 600
            pre_reboot_delay: 0
            post_reboot_delay: 0
          register: reboot
          ignore_unreachable: true

        - name: Wait for k3s service to be active
          ansible.builtin.systemd:
            name: "{{ 'k3s' if 'server' in group_names else 'k3s-agent' }}"
          register: k3s_service
          until: k3s_service.status.ActiveState == "active"
          retries: 15
          delay: 10
          ignore_unreachable: true

        - name: Fail if the node became unreachable
          ansible.builtin.fail:
            msg: "{{ inventory_hostname }} became unreachable after the drain"
          when: reboot is unreachable or k3s_service is unreachable

        # Retry API errors, but let a Ready timeout fail immediately into rescue.
        - name: Wait for node to be Ready
          delegate_to: localhost
          become: false
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Node
            name: "{{ inventory_hostname }}"
            wait: true
            wait_condition:
              type: Ready
              status: "True"
            wait_timeout: 300
          register: node_ready
          until: >-
            node_ready is not failed
            or 'Failed to gather information about Node(s) even after waiting for '
            in (node_ready.msg | default(''))
          retries: 2
          delay: 10

        - name: Uncordon node
          delegate_to: localhost
          become: false
          kubernetes.core.k8s_drain:
            name: "{{ inventory_hostname }}"
            state: uncordon
          register: uncordon
          until: uncordon is not failed
          retries: 5
          delay: 10
          when: not node_was_cordoned

        - name: Remove the playbook cordon marker after uncordoning
          delegate_to: localhost
          become: false
          kubernetes.core.k8s: &clear_cordon_marker
            state: patched
            merge_type: merge
            definition:
              apiVersion: v1
              kind: Node
              metadata:
                name: "{{ inventory_hostname }}"
                annotations:
                  homelab/apt-upgrade-cordon: null
          register: clear_cordon_marker
          until: clear_cordon_marker is not failed
          retries: 5
          delay: 10
          when: not node_was_cordoned

      rescue:

        - name: Check whether the failed node is Ready
          delegate_to: localhost
          become: false
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Node
            name: "{{ inventory_hostname }}"
          register: rescue_node
          failed_when: false

        - name: Decide whether the node can safely be uncordoned
          ansible.builtin.set_fact:
            rescue_node_ready: >-
              {{ rescue_node.resources | default([])
                 | map(attribute='status.conditions') | flatten
                 | selectattr('type', 'eq', 'Ready')
                 | selectattr('status', 'eq', 'True') | list | length > 0 }}

        - name: Uncordon node after a failed drain or reboot
          delegate_to: localhost
          become: false
          kubernetes.core.k8s_drain:
            name: "{{ inventory_hostname }}"
            state: uncordon
          register: rescue_uncordon
          until: rescue_uncordon is not failed
          retries: 5
          delay: 10
          when: not node_was_cordoned and rescue_node_ready

        - name: Remove the playbook cordon marker after rescue uncordoning
          delegate_to: localhost
          become: false
          kubernetes.core.k8s: *clear_cordon_marker
          register: rescue_clear_cordon_marker
          until: rescue_clear_cordon_marker is not failed
          retries: 5
          delay: 10
          when: not node_was_cordoned and rescue_node_ready

        - name: Stop the upgrade
          ansible.builtin.fail:
            msg: >-
              "{{ ansible_failed_task.name }}" failed on {{ inventory_hostname }}
              and the node was {{ 'uncordoned' if not node_was_cordoned and rescue_node_ready else 'left cordoned' }}:
              {{ ansible_failed_result.msg | default('see the output above') }}

    - name: Wait for Longhorn before the next node
      ansible.builtin.include_tasks: tasks/wait_for_longhorn.yaml

    # Evicted pods can pass readiness once and then fail under load on their new node.
    - name: Let workloads settle after the reboot
      when:
        - *reboot_due
        - not ansible_check_mode
      ansible.builtin.pause:
        seconds: 120

    - name: Wait for workloads before the next node
      ansible.builtin.include_tasks: tasks/wait_for_workloads.yaml
