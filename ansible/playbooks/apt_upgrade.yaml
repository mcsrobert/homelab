---
- name: Upgrade remote host
  hosts: k3s_cluster
  become: true
  serial: 1
  vars:
    drain_delegate: "{{ groups['server'] | difference([inventory_hostname]) | first }}"
  environment:
    K8S_AUTH_KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  pre_tasks:

    - name: Update apt repo and cache
      ansible.builtin.apt:
        update_cache: true

    - name: Ensure pip and venv are present on the drain delegate
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-venv
        state: present
      delegate_to: "{{ drain_delegate }}"

    - name: Prepare venv with kubernetes on the drain delegate
      ansible.builtin.pip:
        name: kubernetes==35.0.0
        state: present
        virtualenv: /opt/ansible_venv
        virtualenv_command: /usr/bin/python3 -m venv
      delegate_to: "{{ drain_delegate }}"

  tasks:

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Find kernel packages installed since the last boot
      ansible.builtin.shell: >-
        find /var/lib/dpkg/info -maxdepth 1
        -name 'linux-image-*.list' -size +1k
        -newermt "$(uptime -s)"
      register: new_kernel_packages
      changed_when: false

    - name: Reboot into the new kernel
      when: new_kernel_packages.stdout | length > 0
      block:

        - name: Wait for Longhorn before draining
          ansible.builtin.include_tasks: tasks/wait_for_longhorn.yaml

        - name: Drain node before reboot
          delegate_to: "{{ drain_delegate }}"
          vars:
            ansible_python_interpreter: /opt/ansible_venv/bin/python
          kubernetes.core.k8s_drain:
            name: "{{ inventory_hostname }}"
            state: drain
            delete_options:
              delete_emptydir_data: true
              ignore_daemonsets: true
              force: true
              terminate_grace_period: 60
              wait_timeout: 300
              wait_sleep: 15
            pod_selectors:
              - app!=csi-attacher
              - app!=csi-provisioner
              - longhorn.io/component!=instance-manager
          register: drain
          until: drain is not failed
          retries: 20
          delay: 30

        - name: Reboot node for kernel updates
          ansible.builtin.reboot:
            msg: Reboot initiated by Ansible after package upgrades
            connect_timeout: 5
            reboot_timeout: 600
            pre_reboot_delay: 0
            post_reboot_delay: 0

        - name: Wait for k3s service to be active
          ansible.builtin.systemd:
            name: "{{ 'k3s' if 'server' in group_names else 'k3s-agent' }}"
          register: k3s_service
          until: k3s_service.status.ActiveState == "active"
          retries: 15
          delay: 10

        - name: Wait for node to be Ready
          delegate_to: "{{ drain_delegate }}"
          vars:
            ansible_python_interpreter: /opt/ansible_venv/bin/python
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Node
            name: "{{ inventory_hostname }}"
            wait: true
            wait_condition:
              type: Ready
              status: "True"
            wait_timeout: 300

    - name: Uncordon node
      delegate_to: "{{ drain_delegate }}"
      vars:
        ansible_python_interpreter: /opt/ansible_venv/bin/python
      kubernetes.core.k8s_drain:
        name: "{{ inventory_hostname }}"
        state: uncordon
      register: uncordon
      until: uncordon is not failed
      retries: 5
      delay: 10

    - name: Wait for Longhorn after uncordoning
      ansible.builtin.include_tasks: tasks/wait_for_longhorn.yaml
