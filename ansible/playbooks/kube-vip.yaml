---
# One server at a time, so the VIP always has a kube-vip left to hold it.
- name: Install kube-vip
  hosts: server
  become: true
  gather_facts: true
  serial: 1

  tasks:

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Ensure k3s static pod directory exists
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent/pod-manifests
        state: directory
        mode: "0755"

    - name: Generate kube-vip manifest from template
      ansible.builtin.template:
        src: kube-vip.yaml.j2
        dest: /var/lib/rancher/k3s/agent/pod-manifests/kube-vip.yaml
        mode: "0644"
      notify: Wait for the API server VIP

  handlers:

    # site.yaml installs kube-vip before k3s, so on a fresh node there is no
    # API server behind the VIP yet and nothing to wait for. The delay gives
    # kubelet time to pick up the new manifest and restart the pod.
    - name: Wait for the API server VIP
      ansible.builtin.wait_for:
        host: "{{ api_endpoint }}"
        port: "{{ api_port }}"
        state: started
        delay: 30
        timeout: 300
      when: ansible_facts.services['k3s.service'].state | default('') == 'running'
