---
- name: Install kube-vip
  hosts: server
  become: true
  gather_facts: true
  serial: 1  # Keep an active kube-vip instance during updates.

  tasks:

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Ensure k3s static pod directory exists
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent/pod-manifests
        state: directory
        mode: "0755"

    - name: Generate kube-vip manifest from template
      ansible.builtin.template:
        src: kube-vip.yaml.j2
        dest: /var/lib/rancher/k3s/agent/pod-manifests/kube-vip.yaml
        mode: "0644"
      notify: Wait for the API server VIP

  handlers:

    # On fresh nodes, site.yaml installs kube-vip before the API server exists.
    - name: Wait for the API server VIP
      ansible.builtin.wait_for:
        host: "{{ api_endpoint }}"
        port: "{{ api_port }}"
        state: started
        # Let kubelet pick up the new static pod manifest before probing the VIP.
        delay: 30
        timeout: 300
      when: ansible_facts.services['k3s.service'].state | default('') == 'running'
