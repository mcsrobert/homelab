min_version = "2026.10.0"

[env]
# The SOPS age key lives outside of the repo
SOPS_AGE_KEY_FILE = "{{ env.HOME }}/.config/sops/age/keys.txt"

[tools]
age = "1.3.2"
ansible = "14.5.0"
"aqua:cloudnative-pg/cloudnative-pg/kubectl-cnpg" = "1.30.1"
flux2 = "2.10.0"
"github:home-operations/flate" = "0.6.5"
helm = "4.3.1"
helmfile = "1.8.2"
kubectl = "1.37.1"
kustomize = "5.8.3"
pre-commit = "4.7.0"
sops = "3.13.3"
python = "3.13.18"
# Required by mise to install the pypi backend (ansible)
uv = "0.13.6"

[tasks.setup]
description = "Setup workspace"
depends = ["install-helm-diff-plugin", "install-ansible-collections"]
run = "pre-commit install"

[tasks.pbkdf2]
description = "Generate a PBKDF2-SHA512 hash (options after --)"
run = "uv run scripts/pbkdf2_sha512.py"

[tasks.install-ansible-collections]
description = "Install Ansible collections from requirements.yml"
dir = "{{ config_root }}/ansible"
run = "ansible-galaxy collection install --requirements-file requirements.yml"

[tasks.install-helm-diff-plugin]
description = "Install or upgrade Helm diff plugin"
run = """
if ! helm plugin list | grep -q '^diff\\s'; then
  helm plugin install https://github.com/databus23/helm-diff --verify=false
else
  helm plugin update diff
fi
"""

[tasks.bootstrap-flux]
description = "Install Flux and create a secret with the SOPS key"
dir = "{{ config_root }}"
env.HELMFILE_FILE = "kubernetes/bootstrap/helmfile.yaml"
env.CLUSTER_SETTINGS_FILE = "kubernetes/meta/settings/cluster-settings.yaml"
env.CLUSTER_SECRETS_FILE = "kubernetes/meta/settings/cluster-secrets.sops.yaml"
run = """
set -euo pipefail

for f in "$SOPS_AGE_KEY_FILE" "$CLUSTER_SETTINGS_FILE" "$CLUSTER_SECRETS_FILE"; do
  if [ ! -f "$f" ]; then
    echo "Missing required file: $f" >&2
    exit 1
  fi
done

kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply --server-side --filename -

if ! kubectl get secret sops-age --namespace flux-system; then
  # Flux expects the key to be named age.agekey
  kubectl create secret generic sops-age --namespace flux-system --from-file=age.agekey="$SOPS_AGE_KEY_FILE"
fi

kubectl apply --server-side --filename "$CLUSTER_SETTINGS_FILE"
sops exec-file "$CLUSTER_SECRETS_FILE" "kubectl apply --server-side --filename {}"
helmfile --file "$HELMFILE_FILE" apply --skip-diff-on-install --suppress-diff
"""
