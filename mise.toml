min_version = "2026.10.0"

[env]
SOPS_AGE_KEY_FILE = "{{ env.HOME }}/.config/sops/age/keys.txt"

[tools]
age = "1.3.2"
ansible = "14.6.0"
"aqua:cloudnative-pg/cloudnative-pg/kubectl-cnpg" = "1.30.1"
"aqua:openbao/openbao/bao" = "2.7.2"
flux2 = "2.10.0"
gitleaks = "8.30.1"
"github:home-operations/flate" = "0.7.3"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
"pipx:ansible-lint" = "26.11.0"
pre-commit = "4.7.0"
python = "3.15.2"
shellcheck = "0.11.0"
sops = "3.13.3"
uv = "0.13.8"
yq = "4.54.1"
zizmor = "1.32.0"

[tasks.setup]
description = "Setup workspace"
depends = ["install-helm-diff-plugin", "install-ansible-collections"]
run = "pre-commit install"

[tasks.t3-code-codex-login]
description = "Sign in to Codex in the T3 Code pod"
run = "kubectl exec -n development -it deployment/t3-code -c t3-code -- codex login --device-auth"

[tasks.pbkdf2]
description = "Generate a PBKDF2-SHA512 hash (options after --)"
run = "uv run scripts/pbkdf2_sha512.py"

[tasks.install-ansible-collections]
description = "Install Ansible dependencies and collections"
dir = "{{ config_root }}/ansible"
run = """
uv pip install --python "$(mise where ansible)/ansible/bin/python" --requirement requirements.txt
ansible-galaxy collection install --requirements-file requirements.yml
"""

# Arguments after `mise run <task> --`, such as --limit or --check, are passed
# on to ansible-playbook.
[tasks.ansible-site]
description = "Configure the nodes and install k3s, one server at a time"
dir = "{{ config_root }}/ansible"
run = "ansible-playbook playbooks/site.yaml --forks=1"

[tasks.ansible-upgrade-os]
description = "Upgrade OS packages one node at a time, rebooting for a new kernel"
dir = "{{ config_root }}/ansible"
run = "ansible-playbook playbooks/apt_upgrade.yaml"

[tasks.ansible-upgrade-k3s]
description = "Upgrade k3s, one server at a time"
dir = "{{ config_root }}/ansible"
run = "ansible-playbook playbooks/upgrade.yaml"

[tasks.ansible-rotate-token]
description = "Rotate the k3s token, then restart the nodes with it one server at a time"
confirm = "Rotate the k3s token and restart every node?"
dir = "{{ config_root }}/ansible"
run = """
#!/usr/bin/env bash
set -euo pipefail

if [ $# -gt 0 ]; then
  echo "ansible-rotate-token takes no arguments" >&2
  exit 1
fi

file=inventory/group_vars/k3s_cluster.sops.yaml
if ! git ls-files --error-unmatch "$file" >/dev/null 2>&1 ||
  ! git diff --quiet HEAD -- "$file"; then
  echo "Commit $file before rotating the token" >&2
  exit 1
fi

old_token=$(sops decrypt --extract '["token"]' "$file")
case $old_token in
  K10*::server:*) ;;
  *)
    echo "The token in $file is not in the full K10...::server:... format" >&2
    exit 1
    ;;
esac

# Keep the CA hash, replace the passphrase. Write the new token before the
# rotation so it is never only on the servers.
passphrase=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
printf '%s' "${old_token%%::server:*}::server:$passphrase" |
  jq --raw-input . | sops set --value-stdin "$file" '["token"]'

if ! K3S_OLD_TOKEN=$old_token ansible-playbook playbooks/rotate-token.yaml; then
  echo "Rotation failed. $file holds the new token, git HEAD the old one." >&2
  echo 'If the servers still accept the old token, run: git -C "$(git rev-parse --show-toplevel)" restore ansible/'"$file" >&2
  exit 1
fi

if ! ansible-playbook k3s.orchestration.site --forks=1; then
  echo "The servers use the new token now. Commit ansible/$file," >&2
  echo "fix the failure and run mise run ansible-site." >&2
  exit 1
fi

echo "Token rotated. Commit ansible/$file."
"""

[tasks.install-helm-diff-plugin]
description = "Install or upgrade Helm diff plugin"
run = """
if helm plugin list | grep -q '^diff[[:space:]]'; then
  helm plugin update diff
else
  helm plugin install https://github.com/databus23/helm-diff --verify=false
fi
"""

[tasks.bootstrap-flux]
description = "Install Flux and create a secret with the SOPS key"
confirm = "Bootstrap Flux on the current kube context?"
depends = ["install-helm-diff-plugin"]
run = """
kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply --server-side --filename -

kubectl get secret sops-age --namespace flux-system >/dev/null 2>&1 ||
  kubectl create secret generic sops-age --namespace flux-system --from-file=age.agekey="$SOPS_AGE_KEY_FILE"

kubectl apply --server-side --filename kubernetes/meta/settings/cluster-settings.yaml
sops exec-file kubernetes/meta/settings/cluster-secrets.sops.yaml "kubectl apply --server-side --filename {}"
helmfile --file kubernetes/bootstrap/helmfile.yaml apply --skip-diff-on-install --suppress-diff
"""
