---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: keda-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # KEDA manages and validates scaling resources.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: keda_core_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
          comps: [=, startswith, =, =, =]
          values:
            - - system
              - keda-operator-
              - ghcr.io/kedacore/keda
              - keda-operator
              - /keda
            - - system
              - keda-admission-webhooks-
              - ghcr.io/kedacore/keda-admission-webhooks
              - keda-admission-webhooks
              - /keda-admission-webhooks
      override:
        exceptions: append
    # HTTP add-on components watch routing and scaling resources.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: keda_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
          comps: [=, startswith, =, =, =, =]
          values:
            - - system
              - keda-add-ons-http-controller-manager-
              - ghcr.io/kedacore/http-add-on-operator
              - keda-add-ons-http-operator
              - operator
              - /ko-app/operator
            - - system
              - keda-add-ons-http-external-scaler-
              - ghcr.io/kedacore/http-add-on-scaler
              - keda-add-ons-http-external-scaler
              - scaler
              - /ko-app/scaler
            - - system
              - keda-add-ons-http-interceptor-
              - ghcr.io/kedacore/http-add-on-interceptor
              - keda-add-ons-http-interceptor
              - interceptor
              - /ko-app/interceptor
      override:
        exceptions: append
