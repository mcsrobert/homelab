---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: reloader-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # Reloader watches ConfigMaps and Secrets and updates workloads.
    - macro: k8s_containers
      override:
        condition: append
      condition: >
        or (container.image.repository = "ghcr.io/stakater/reloader" and k8s.ns.name = "system" and container.name = "reloader" and proc.exepath = "/manager")
