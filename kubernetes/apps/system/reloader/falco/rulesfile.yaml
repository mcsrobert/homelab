---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: reloader-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # Reloader watches ConfigMaps and Secrets and updates workloads.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: reloader_api_clients
          fields:
            - container.image.repository
            - k8s.ns.name
            - container.name
            - proc.exepath
            - k8s.pod.name
          comps: [=, =, =, =, startswith]
          values:
            - - ghcr.io/stakater/reloader
              - system
              - reloader
              - /manager
              - reloader-
      override:
        exceptions: append
