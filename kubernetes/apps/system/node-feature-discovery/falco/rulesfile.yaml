---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: node-feature-discovery-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # The worker publishes node features.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: node_feature_discovery_worker_api
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
          comps: [=, startswith, =, =, =]
          values:
            - - system
              - node-feature-discovery-worker-
              - registry.k8s.io/nfd/node-feature-discovery
              - worker
              - /usr/bin/nfd-worker
      override:
        exceptions: append
    # The master publishes labels; GC removes stale feature resources.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: node_feature_discovery_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
          comps: [=, startswith, =, =, =, =]
          values:
            - - system
              - node-feature-discovery-master-
              - registry.k8s.io/nfd/node-feature-discovery
              - master
              - nfd-master
              - /usr/bin/nfd-master
            - - system
              - node-feature-discovery-gc-
              - registry.k8s.io/nfd/node-feature-discovery
              - gc
              - nfd-gc
              - /usr/bin/nfd-gc
      override:
        exceptions: append
