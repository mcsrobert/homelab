---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: node-feature-discovery-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # The worker publishes node features.
    - macro: k8s_containers
      override:
        condition: append
      condition: >
        or (container.image.repository = "registry.k8s.io/nfd/node-feature-discovery" and k8s.ns.name = "system" and container.name = "worker" and proc.exepath = "/usr/bin/nfd-worker" and k8s.pod.name startswith "node-feature-discovery-worker-")
    # The master publishes labels; GC removes stale feature resources.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: node_feature_discovery_api_clients
          fields:
            - k8s.pod.name
            - k8s.ns.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
          comps: [startswith, =, =, =, =, =]
          values:
            - - node-feature-discovery-master-
              - system
              - registry.k8s.io/nfd/node-feature-discovery
              - master
              - nfd-master
              - /usr/bin/nfd-master
            - - node-feature-discovery-gc-
              - system
              - registry.k8s.io/nfd/node-feature-discovery
              - gc
              - nfd-gc
              - /usr/bin/nfd-gc
      override:
        exceptions: append
