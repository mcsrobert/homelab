---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maddy
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      maddy:
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 13000
            runAsGroup: 13000
            fsGroup: 13000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: maddy
        containers:
          maddy:
            image:
              repository: ghcr.io/foxcpp/maddy
              tag: 0.9.6@sha256:e1074e92a452b84d1135ebe8ab831c5f541d33dcbd39e38fab740a53bbf2f97c
            env:
              TZ: ${TIME_ZONE}
              SMTP_PORT: &port 2525
              METRICS_PORT: &metricsPort 9000
            envFrom:
              - secretRef:
                  name: maddy-env
            probes:
              startup: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - "echo -e 'EHLO localhost\r\nQUIT\r\n' | nc -w 5 127.0.0.1 $SMTP_PORT"
              readiness: *probe
              liveness: *probe
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                memory: 64M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        type: configMap
        name: maddy-config
        globalMounts:
          - path: /data/maddy.conf
            subPath: maddy.conf
      tmp:
        type: emptyDir
    service:
      maddy:
        ports:
          smtp:
            port: *port
            protocol: TCP
            primary: true
          metrics:
            port: *metricsPort
            protocol: HTTP
    serviceMonitor:
      maddy:
        endpoints:
          - port: metrics
