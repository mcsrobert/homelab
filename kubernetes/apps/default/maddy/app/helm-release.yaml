---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maddy
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      maddy:
        type: statefulset
        replicas: 2
        podDisruptionBudget:
          minAvailable: 1
        strategy: RollingUpdate
        statefulset:
          podManagementPolicy: Parallel
          persistentVolumeClaimRetentionPolicy:
            whenDeleted: Retain
            whenScaled: Retain
          # Each replica owns its queue; two processes must not share one queue directory.
          volumeClaimTemplates:
            - name: state
              accessMode: ReadWriteOnce
              storageClass: longhorn-no-backup
              size: 1Gi
              globalMounts:
                - path: /var/lib/maddy
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 13000
            runAsGroup: 13000
            fsGroup: 13000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: maddy
        containers:
          maddy:
            image:
              repository: ghcr.io/foxcpp/maddy
              tag: 0.9.7@sha256:b7423da1e97768ace9d790e441e59a698896d35432d8cdfa55b7c229d7847e72
            env:
              TZ: ${TIME_ZONE}
              PORT: &port 2525
              METRICS_PORT: &metricsPort 9000
            envFrom:
              - secretRef:
                  name: maddy-env
            probes:
              startup: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - "echo -e 'EHLO localhost\r\nQUIT\r\n' | nc -w 5 127.0.0.1 $PORT"
              readiness: *probe
              liveness: *probe
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                memory: 64M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        type: configMap
        name: maddy-config
        globalMounts:
          - path: /data/maddy.conf
            subPath: maddy.conf
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
    service:
      maddy:
        ports:
          smtp:
            port: *port
            protocol: TCP
            primary: true
          metrics:
            port: *metricsPort
            protocol: HTTP
    serviceMonitor:
      maddy:
        service:
          identifier: maddy
        endpoints:
          - port: metrics
