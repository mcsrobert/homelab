---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      garage:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 7000
            runAsGroup: &nfsGroup 65538
            fsGroup: *nfsGroup
          # Garage crashes with exit code 132 on the Raspberry Pi 4.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - raspberrypi
        containers:
          garage:
            image:
              repository: dxflrs/garage
              tag: v2.6.0@sha256:4b5a318fc9fe2fbec5d3af590eeafe05d83492e6411266fa0b9e215c20264013
            env:
              TZ: ${TIME_ZONE}
            probes: &probes
              liveness: &probe
                enabled: true
              readiness: *probe
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      webui:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 7001
            runAsGroup: 7001
            fsGroup: 7001
        containers:
          garage-webui:
            image:
              repository: khairul169/garage-webui
              tag: 1.1.0@sha256:17c793551873155065bf9a022dabcde874de808a1f26e648d4b82e168806439c
            env:
              TZ: ${TIME_ZONE}
              API_BASE_URL: http://garage:3903
              S3_ENDPOINT_URL: http://garage:3900
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
            probes: *probes
            securityContext: *securityContext
    persistence:
      config:
        type: secret
        name: garage-config
        globalMounts:
          - path: /etc/garage.toml
            subPath: garage.toml
      meta:
        type: persistentVolumeClaim
        forceRename: &metaVolume garage-meta
        retain: true
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 1Gi
        volumeName: *metaVolume
        advancedMounts:
          garage:
            garage:
              - path: /meta
      data:
        type: nfs
        server: ${NAS_IP}
        path: /volume1/garage
        advancedMounts:
          garage:
            garage:
              - path: /data
    service:
      garage:
        controller: garage
        ports:
          s3:
            port: 3900
            protocol: HTTP
            primary: true
          api:
            port: 3903
            protocol: HTTP
      webui:
        controller: webui
        ports:
          http:
            port: 3909
            protocol: HTTP
    serviceMonitor:
      server:
        service:
          identifier: garage
        endpoints:
          - port: api
            path: /metrics
            authorization:
              type: Bearer
              credentials:
                name: garage-metrics
                key: token
    route:
      garage:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Garage
          gethomepage.dev/icon: garage
          gethomepage.dev/description: S3-compatible object store for small self-hosted deployments
          gethomepage.dev/group: Storage
          gethomepage.dev/pod-selector: app.kubernetes.io/name = garage
        hostnames:
          - garage.${CLUSTER_DOMAIN}
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: auth-chain
            backendRefs:
              - kind: Service
                name: keda-add-ons-http-interceptor-proxy
                namespace: system
                port: 8080
        parentRefs:
          - name: traefik-gateway
            namespace: network
            sectionName: websecure
    networkpolicies:
      garage:
        # The webui controller shares the app.kubernetes.io/name label.
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: garage
            app.kubernetes.io/controller: garage
        policyTypes:
          - Ingress
        rules:
          ingress:
            - from:
                - podSelector:
                    matchLabels:
                      cnpg.io/cluster: immich-cnpg
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: garage
                      app.kubernetes.io/controller: webui
              ports:
                - port: 3900
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: garage
                      app.kubernetes.io/controller: garage
              ports:
                - port: 3901
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: garage
                      app.kubernetes.io/controller: webui
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: observability
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: vmagent
              ports:
                - port: 3903
