---
- Network:
    - FRITZ!Box 5590:
        href: http://fritz.box
        description: Fiber modem and WiFi 6 router
        icon: avm-fritzbox
        widget:
          type: fritzbox
          url: http://${FRITZBOX_IP}
    - MetalLB:
        description: Bare-metal load-balancing for Kubernetes
        icon: metallb
        app: metallb
        namespace: network
    - Traefik:
        description: Modern reverse proxy for applications
        icon: traefik-proxy
        namespace: network
        app: traefik
    - Tailscale:
        href: https://login.tailscale.com/admin/machines
        description: Zero-config VPN with WireGuard
        icon: tailscale
        app: tailscale
        namespace: network
        podSelector: app.kubernetes.io/name in (tailscale, tailscale-operator)
- Kubernetes:
    - OpenBao:
        href: https://bao.${CLUSTER_DOMAIN}
        description: Manage, store, and distribute sensitive data
        icon: openbao
        app: openbao
        namespace: security
        podSelector: app.kubernetes.io/name=openbao
