---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: homepage-exceptions
spec:
  priority: 60
  inlineRules:
    - rule: Contact K8S API Server From Container
      exceptions:
        # Falco reports a truncated Next.js process name (PR #1251).
        - name: homepage_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
          comps: [=, startswith, =, =, =, =]
          values:
            - - default
              - homepage-
              - ghcr.io/gethomepage/homepage
              - homepage
              - "next-server (v"
              - /usr/local/bin/node
        - name: homepage_node_server_api_client
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
            - proc.cmdline
          comps: [=, startswith, =, =, =, =]
          values:
            - - default
              - homepage-
              - ghcr.io/gethomepage/homepage
              - homepage
              - /usr/local/bin/node
              - node server.js
      override:
        exceptions: append
