---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: homepage-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # Homepage (default) reads pods, nodes, ingresses and HTTPRoutes for its widgets.
    - macro: k8s_containers
      override:
        condition: append
      condition: >
        or (container.image.repository = "ghcr.io/gethomepage/homepage" and k8s.ns.name = "default" and container.name = "homepage" and k8s.pod.name startswith "homepage-")
