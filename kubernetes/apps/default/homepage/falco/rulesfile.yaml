---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: homepage-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # Homepage (default) reads pods, nodes, ingresses and HTTPRoutes for its widgets.
    - rule: Contact K8S API Server From Container
      exceptions:
        # PR #1251; retained Nov 5-6 events report the truncated Next.js process name.
        - name: homepage_api_clients
          fields:
            - container.image.repository
            - k8s.ns.name
            - container.name
            - k8s.pod.name
            - proc.name
            - proc.exepath
          comps: [=, =, =, startswith, =, =]
          values:
            - - ghcr.io/gethomepage/homepage
              - default
              - homepage
              - homepage-
              - "next-server (v"
              - /usr/local/bin/node
      override:
        exceptions: append
