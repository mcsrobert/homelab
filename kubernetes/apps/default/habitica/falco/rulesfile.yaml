---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: habitica-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # MongoDB agent readinessprobe (default) talks to the API from the operator's probe script.
    - rule: Contact K8S API Server From Container
      exceptions:
        # PR #1251 investigation captured this probe executable in Falco events.
        - name: habitica_api_clients
          fields:
            - container.image.repository
            - k8s.ns.name
            - proc.name
            - container.name
            - k8s.pod.name
            - proc.exepath
          comps: [=, =, =, =, startswith, =]
          values:
            - - quay.io/mongodb/mongodb-agent
              - default
              - readinessprobe
              - mongodb-agent
              - habitica-mongodb-
              - /opt/scripts/readinessprobe
      override:
        exceptions: append
