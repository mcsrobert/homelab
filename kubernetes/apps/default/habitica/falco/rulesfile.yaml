---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: habitica-exceptions
spec:
  priority: 60
  inlineRules:
    - rule: Contact K8S API Server From Container
      exceptions:
        # The MongoDB agent readiness probe calls the API (PR #1251).
        - name: habitica_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
          comps: [=, startswith, =, =, =, =]
          values:
            - - default
              - habitica-mongodb-
              - quay.io/mongodb/mongodb-agent
              - mongodb-agent
              - readinessprobe
              - /opt/scripts/readinessprobe
      override:
        exceptions: append
