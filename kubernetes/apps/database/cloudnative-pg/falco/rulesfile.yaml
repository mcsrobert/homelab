---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: cloudnative-pg-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # CloudNativePG operator (database) reconciles Cluster resources.
    - macro: k8s_containers
      override:
        condition: append
      condition: >
        or (container.image.repository = "ghcr.io/cloudnative-pg/cloudnative-pg" and k8s.ns.name = "database" and container.name = "manager" and k8s.pod.name startswith "cloudnative-pg-")
