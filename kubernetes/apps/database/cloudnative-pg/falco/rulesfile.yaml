---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: cloudnative-pg-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # CloudNativePG operator (database) reconciles Cluster resources.
    - rule: Contact K8S API Server From Container
      exceptions:
        # PR #1253; retained Nov 6 API event identifies the ARM64 operator executable.
        - name: cloudnative_pg_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
          comps: [=, startswith, =, =, =, =]
          values:
            - - database
              - cloudnative-pg-
              - ghcr.io/cloudnative-pg/cloudnative-pg
              - manager
              - manager
              - /operator/manager_arm64
      override:
        exceptions: append
