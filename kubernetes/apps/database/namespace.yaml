---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.1-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: database
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # Pod Security Admission: baseline is enforced. Warn and audit use restricted
    # to show the remaining gap.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
