---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/policies.kyverno.io/mutatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: dragonfly-add-node-selector
  annotations:
    policies.kyverno.io/title: Dragonfly Add Node Selector
    policies.kyverno.io/description: >-
      Only schedule Dragonfly pods on nodes that support the required CPU
      features. This policy automatically adds a nodeSelector with the
      NodeFeatureRule label to the spec of Dragonfly CR.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["dragonflydb.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["dragonflies"]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              nodeSelector: {
                "feature.node.kubernetes.io/dragonfly.capable": "true"
              }
            }
          }
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/policies.kyverno.io/mutatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  # Workaround for the operator reserving the instance label without adding it to pods.
  # https://github.com/dragonflydb/dragonfly-operator/issues/585#issuecomment-6766564397
  name: dragonfly-add-pod-instance-label
  annotations:
    policies.kyverno.io/title: Dragonfly Add Pod Instance Label
    policies.kyverno.io/description: >-
      Preserve instance selectors for Homepage, network policies and topology
      spreading. The operator reserves the key in Dragonfly specs but does not
      put it on pods. Copy its stable app label directly onto existing and new
      pods, without restarting the OnDelete StatefulSets.
spec:
  evaluation:
    mutateExisting:
      enabled: true
    skipBackgroundRequests: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    objectSelector:
      matchLabels:
        app.kubernetes.io/name: dragonfly
        app.kubernetes.io/part-of: dragonfly
  matchConditions:
    - name: dragonfly-statefulset-pod
      expression: >-
        has(object.metadata.labels) &&
        "app" in object.metadata.labels &&
        has(object.metadata.ownerReferences) &&
        object.metadata.ownerReferences.exists(owner,
          owner.apiVersion == "apps/v1" &&
          owner.kind == "StatefulSet" &&
          has(owner.controller) && owner.controller &&
          owner.name == object.metadata.labels["app"])
    - name: instance-label-missing
      expression: >-
        !("app.kubernetes.io/instance" in object.metadata.labels)
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            metadata: Object.metadata{
              labels: {
                "app.kubernetes.io/instance": object.metadata.labels["app"]
              }
            }
          }
