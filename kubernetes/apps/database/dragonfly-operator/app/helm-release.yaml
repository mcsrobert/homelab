---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values: # https://github.com/dragonflydb/dragonfly-operator/blob/main/charts/dragonfly-operator/values.yaml
    manager:
      image:
        repository: docker.dragonflydb.io/dragonflydb/operator
        tag: v1.7.1@sha256:bc0067369a456810d00715d7292da32b82f6df491fd51d6c57f2b2b3193ab490
      extraArgs:
        # See: https://github.com/dragonflydb/dragonfly-operator/issues/258
        - --metrics-bind-address=0.0.0.0:8080
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 64Mi
    rbacProxy:
      image:
        repository: quay.io/brancz/kube-rbac-proxy
        tag: v0.20.2@sha256:ad0fa9f0adc928b557663297bd22c610533960d77acdec289ce8a636f0ea2114
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
