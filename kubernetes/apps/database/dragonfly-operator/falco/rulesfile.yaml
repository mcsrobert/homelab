---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: dragonfly-operator-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # Dragonfly kube-rbac-proxy (database) runs TokenReview/SubjectAccessReview for metrics auth.
    - rule: Contact K8S API Server From Container
      exceptions:
        # PR #1251; retained Nov 5-6 API events identify this proxy executable.
        - name: dragonfly_operator_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
          comps: [=, startswith, =, =, =, =]
          values:
            - - database
              - dragonfly-operator-
              - quay.io/brancz/kube-rbac-proxy
              - kube-rbac-proxy
              - kube-rbac-proxy
              - /usr/local/bin/kube-rbac-proxy
      override:
        exceptions: append
    # The operator manager watches Dragonfly resources and maintains its leader lease.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: dragonfly_manager_api
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
          comps: [=, startswith, =, =, =, =]
          values:
            - - database
              - dragonfly-operator-
              - docker.dragonflydb.io/dragonflydb/operator
              - manager
              - manager
              - /manager
      override:
        exceptions: append
