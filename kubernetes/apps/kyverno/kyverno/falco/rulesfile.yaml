---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: kyverno-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # Kyverno's admission controller watches and manages Kubernetes resources.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: kyverno_api_clients
          fields:
            - container.image.repository
            - k8s.ns.name
            - container.name
            - proc.exepath
            - k8s.pod.name
          comps: [=, =, =, =, startswith]
          values:
            - - reg.kyverno.io/kyverno/kyverno
              - kyverno
              - kyverno
              - /ko-app/kyverno
              - kyverno-admission-controller-
      override:
        exceptions: append
    # These controllers watch and reconcile resources through the Kubernetes API.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: kyverno_controller_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
          comps: [=, startswith, =, =, =, =]
          values:
            - - kyverno
              - kyverno-background-controller-
              - reg.kyverno.io/kyverno/background-controller
              - controller
              - background-cont
              - /ko-app/background-controller
            - - kyverno
              - kyverno-cleanup-controller-
              - reg.kyverno.io/kyverno/cleanup-controller
              - controller
              - cleanup-control
              - /ko-app/cleanup-controller
            - - kyverno
              - kyverno-reports-controller-
              - reg.kyverno.io/kyverno/reports-controller
              - controller
              - reports-control
              - /ko-app/reports-controller
        # Helm's post-upgrade hook migrates stored CRD resource versions.
        - name: kyverno_resource_migration
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
            - proc.cmdline
          comps: [=, startswith, =, =, =, =, startswith]
          values:
            - - kyverno
              - kyverno-migrate-resources-
              - reg.kyverno.io/kyverno/kyverno-cli
              - kyverno-cli
              - kubectl-kyverno
              - /ko-app/kubectl-kyverno
              - "kubectl-kyverno migrate --resource "
      override:
        exceptions: append
