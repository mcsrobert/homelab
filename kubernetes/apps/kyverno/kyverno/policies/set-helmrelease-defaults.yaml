---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/policies.kyverno.io/mutatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: set-helmrelease-defaults
  annotations:
    policies.kyverno.io/title: HelmRelease defaults
    policies.kyverno.io/description: >-
      Retries failed Flux HelmRelease installs and upgrades in place, without
      rollback, uninstall or cleanup, and enables drift detection, when these
      fields are not set in the manifest.
spec:
  evaluation:
    mutateExisting:
      enabled: true
    skipBackgroundRequests: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["helm.toolkit.fluxcd.io"]
        apiVersions: ["v2"]
        resources: ["helmreleases"]
        operations: ["CREATE", "UPDATE"]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              driftDetection: Object.spec.driftDetection{
                mode: object.?spec.?driftDetection.?mode.orValue("enabled")
              },
              install: Object.spec.install{
                strategy: Object.spec.install.strategy{
                  name: object.?spec.?install.?strategy.?name.orValue("RetryOnFailure")
                }
              },
              upgrade: Object.spec.upgrade{
                cleanupOnFail: object.?spec.?upgrade.?cleanupOnFail.orValue(false),
                strategy: Object.spec.upgrade.strategy{
                  name: object.?spec.?upgrade.?strategy.?name.orValue("RetryOnFailure")
                }
              }
            }
          }
