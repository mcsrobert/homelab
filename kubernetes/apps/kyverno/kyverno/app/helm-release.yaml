---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  chartRef:
    kind: OCIRepository
    name: kyverno
  interval: 1h
  # CRD migrations require manual recovery. RetryOnFailure bypasses remediation,
  # which is kept explicit for reporting in Kyverno's webhook-exempt namespace.
  # https://kyverno.io/docs/installation/upgrading/
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    cleanupOnFail: false
    remediation:
      strategy: rollback
      retries: 3
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:

    # The pin-image-digests webhook skips this namespace.
    crds:
      migration:
        image: &cliImage
          registry: reg.kyverno.io
          repository: kyverno/kyverno-cli
          tag: v1.20.0@sha256:bd2b8b7c9d550ecf04e0bacaf351adce2f82ce67fd3f291075edcee7f8ab4ab4

    upgrade:
      legacyPolicyCheck:
        image: *cliImage

    admissionController:
      replicas: 2
      sigstoreVolume:
        emptyDir:
          sizeLimit: &sigstoreSizeLimit 256Mi
      initContainer:
        image:
          registry: reg.kyverno.io
          repository: kyverno/kyvernopre
          tag: v1.20.0@sha256:339067e083430e0c97007541bef9cfdbac89bee13f7228772c77ae8aead14b8b
      container:
        image:
          registry: reg.kyverno.io
          repository: kyverno/kyverno
          tag: v1.20.0@sha256:9de49c5416ea536f00a205527197ac048abdf32c5a75d633cd9afff8928f359d
      rbac:
        clusterRole:
          extraResources:
            - apiGroups:
                - helm.toolkit.fluxcd.io
              resources:
                - helmreleases
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - dragonflydb.io
              resources:
                - dragonflies
              verbs:
                - get
                - list
                - watch
      serviceMonitor:
        enabled: true

    backgroundController:
      image:
        registry: reg.kyverno.io
        repository: kyverno/background-controller
        tag: v1.20.0@sha256:c72df38320a48fc9de10f9d23d087a117853bb08207b7f60f6d1e8457fb3ddb7
      rbac:
        clusterRole:
          extraResources:
            - apiGroups:
                - helm.toolkit.fluxcd.io
              resources:
                - helmreleases
              verbs:
                - get
                - list
                - watch
                - update
                - patch
            - apiGroups:
                - ""
              resources:
                - pods
              verbs:
                - get
                - list
                - watch
                - update
                - patch
            - apiGroups:
                - notification.toolkit.fluxcd.io
              resources:
                - providers
                - alerts
              verbs:
                - create
                - get
                - list
                - watch
                - update
                - patch
                - delete
      serviceMonitor:
        enabled: true

    cleanupController:
      image:
        registry: reg.kyverno.io
        repository: kyverno/cleanup-controller
        tag: v1.20.0@sha256:0f9ce0c203561c52499e871a987ff987371f57385fcafe7af1a01dfd6db1feee
      serviceMonitor:
        enabled: true

    reportsController:
      sigstoreVolume:
        emptyDir:
          sizeLimit: *sigstoreSizeLimit
      image:
        registry: reg.kyverno.io
        repository: kyverno/reports-controller
        tag: v1.20.0@sha256:f54e3cc106fadb1a615d0ec11c42f741f51d3580a5f70dfbe7bd7ec58864ef03
      serviceMonitor:
        enabled: true

    grafana:
      enabled: true
      annotations:
        grafana_folder: kyverno
