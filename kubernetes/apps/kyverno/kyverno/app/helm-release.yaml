---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  chart:
    spec:
      chart: kyverno
      version: 3.9.2
      sourceRef:
        kind: HelmRepository
        name: kyverno
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:  # https://github.com/kyverno/kyverno/tree/main/charts/kyverno#values

    admissionController:
      replicas: 2
      container:
        image:
          registry: reg.kyverno.io
          repository: kyverno/kyverno
          tag: v1.19.2@sha256:c8c4dd09e720d2cd7fd24ca73ac28e46651001372f988e0cba3f2f612f04b955
      initContainer:
        image:
          registry: reg.kyverno.io
          repository: kyverno/kyvernopre
          tag: v1.19.2@sha256:27f3cc52e628559b56d08363b85316819802086c9808606914f7805a244148f4
      rbac:
        clusterRole:
          extraResources:
            - apiGroups:
                - helm.toolkit.fluxcd.io
              resources:
                - helmreleases
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - dragonflydb.io
              resources:
                - dragonflies
              verbs:
                - get
                - list
                - watch
      serviceMonitor:
        enabled: true

    backgroundController:
      image:
        registry: reg.kyverno.io
        repository: kyverno/background-controller
        tag: v1.19.2@sha256:c46e124f21ef8a6bb4b48de57106808b1007edcd5ddd4ff7df5d23b9efa60ce2
      rbac:
        clusterRole:
          extraResources:
            - apiGroups:
                - helm.toolkit.fluxcd.io
              resources:
                - helmreleases
              verbs:
                - get
                - list
                - watch
                - update
                - patch
            - apiGroups:
                - notification.toolkit.fluxcd.io
              resources:
                - providers
                - alerts
              verbs:
                - create
                - get
                - list
                - watch
                - update
                - patch
                - delete
      serviceMonitor:
        enabled: true

    cleanupController:
      image:
        registry: reg.kyverno.io
        repository: kyverno/cleanup-controller
        tag: v1.19.2@sha256:d7340aa7c9315080c3dafa7b765d090ced37353e89e5cd7a3f9ac69e8fb532b2
      serviceMonitor:
        enabled: true

    reportsController:
      image:
        registry: reg.kyverno.io
        repository: kyverno/reports-controller
        tag: v1.19.2@sha256:5fb6d3e738050dbce84f60ecabaede7665fbe0578d07c1e8c912443b035e79c3
      serviceMonitor:
        enabled: true

    crds:
      migration:
        image:
          registry: reg.kyverno.io
          repository: kyverno/kyverno-cli
          tag: v1.19.2@sha256:322ec5044d600930cb3af0e56dc33154a2d1d1fba58f4cadad3f47be7e78b11c

    webhooksCleanup:
      image:
        registry: ghcr.io
        repository: kyverno/readiness-checker
        tag: v1.19.2@sha256:02600428e7c956e222f4376413525866ed9fec28e6bcb1222774ce6bf5fc904a

    grafana:
      enabled: true
      annotations:
        grafana_folder: kyverno
