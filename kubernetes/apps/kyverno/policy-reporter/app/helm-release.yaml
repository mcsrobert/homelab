---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
spec:
  chartRef:
    kind: OCIRepository
    name: policy-reporter
  interval: 1h
  values:  # https://github.com/kyverno/policy-reporter/tree/main/charts/policy-reporter

    # Kyverno keeps its own namespace out of its webhooks, so pin-image-digests
    # cannot pin these pods. The images are pinned here instead, and Renovate
    # groups them with the chart (.github/renovate/groups.json5).
    image:
      registry: ghcr.io
      repository: kyverno/policy-reporter
      tag: 3.11.2@sha256:2b33409d34be3195f16d9ed2c89f8b58001aeec986b254ba6bb45323d6d1e884

    sqliteVolume:
      emptyDir:
        sizeLimit: 1Gi

    tmpVolume:
      emptyDir:
        sizeLimit: &tmpSizeLimit 256Mi

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

    metrics:
      enabled: true

    monitoring:
      enabled: true

    ui:
      enabled: true
      tmpVolume:
        emptyDir:
          sizeLimit: *tmpSizeLimit
      image:
        registry: ghcr.io
        repository: kyverno/policy-reporter-ui
        tag: 2.9.1@sha256:642762427ef5bc941b22f51f6e7c5c8f116a0635132239d11fc89826edbd3eaf
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      httproute:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Policy Reporter
          gethomepage.dev/icon: kyverno
          gethomepage.dev/description: Dashboard for Kyverno policy reports
          gethomepage.dev/group: Kubernetes
          gethomepage.dev/pod-selector: app.kubernetes.io/instance=policy-reporter
        parentRefs:
          - name: traefik-gateway
            namespace: network
            sectionName: websecure
        hostnames:
          - policy-reporter.${CLUSTER_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: auth-chain
