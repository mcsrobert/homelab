---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: victoria-metrics-operator-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # The operator reconciles resources; its generated config sidecars read secrets.
    # The sync job provisions dashboard ConfigMaps and VMRules through the API.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: victoria_metrics_operator_and_sync_api
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
          comps: [=, startswith, =, =, =]
          values:
            - - observability
              - victoria-metrics-operator-
              - docker.io/victoriametrics/operator
              - operator
              - /app
            - - observability
              - victoria-metrics-sync-job-
              - ghcr.io/victoriametrics/sync-job
              - sync-job
              - /sync-job
        - name: victoria_metrics_config_api
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
          comps: [=, startswith, =, in, =]
          values:
            - - observability
              - vmagent-victoria-metrics-
              - docker.io/victoriametrics/operator
              - [config-init, config-reloader]
              - /app
            - - observability
              - vmalert-victoria-metrics-
              - docker.io/victoriametrics/operator
              - [config-init, config-reloader]
              - /app
            - - observability
              - vmalertmanager-victoria-metrics-
              - docker.io/victoriametrics/operator
              - [config-init, config-reloader]
              - /app
      override:
        exceptions: append
