---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: victoria-metrics-operator-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # The operator reconciles resources; its generated config sidecars read secrets.
    - macro: k8s_containers
      override:
        condition: append
      condition: >
        or (container.image.repository = "docker.io/victoriametrics/operator" and k8s.ns.name = "observability" and container.name = "operator" and proc.exepath = "/app" and k8s.pod.name startswith "victoria-metrics-operator-")
        or (container.image.repository = "docker.io/victoriametrics/operator" and k8s.ns.name = "observability" and container.name in ("config-init", "config-reloader")
        and (k8s.pod.name startswith "vmagent-victoria-metrics-"
        or k8s.pod.name startswith "vmalert-victoria-metrics-"
        or k8s.pod.name startswith "vmalertmanager-victoria-metrics-"))
