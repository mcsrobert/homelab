---
route:
  receiver: ntfy
  group_by:
    - alertname
  routes:
    - receiver: backup
      matchers:
        - alertname = "AlertmanagerClusterFailedToSendAlerts"
      repeat_interval: 4h
    - receiver: heartbeat
      matchers:
        - alertname = "Watchdog"
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 4m
    - receiver: blackhole
      matchers:
        - alertname = "InfoInhibitor"
receivers:
  - name: ntfy
    webhook_configs:
      - url: http://alertmanager-ntfy:8000/hook
        http_config:
          basic_auth:
            username: "{{ .ALERTMANAGER_NTFY_USERNAME }}"
            password: "{{ .ALERTMANAGER_NTFY_PASSWORD }}"
  - name: backup
    email_configs:
      - to: ${ADMIN_EMAIL}
        from: noreply@mail.${CLUSTER_DOMAIN}
        smarthost: send.simplemailservice.eu:587
        auth_username: "{{ .SMTP_USERNAME }}"
        auth_password: "{{ .SMTP_PASSWORD }}"
        require_tls: true
  - name: heartbeat
    webhook_configs:
      - url: "https://hc-ping.com/{{ .HEALTHCHECKSIO_UUID }}"
        send_resolved: false
        max_alerts: 1
  - name: blackhole
    webhook_configs: []
