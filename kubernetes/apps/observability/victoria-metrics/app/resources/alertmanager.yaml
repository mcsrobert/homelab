---
route:
  receiver: ntfy
  group_by:
    - alertname
  routes:
    - receiver: backup
      matchers:
        - alertname = "AlertmanagerClusterFailedToSendAlerts"
      repeat_interval: 4h
    - receiver: heartbeat
      matchers:
        - alertname = "Watchdog"
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 4m
    - receiver: blackhole
      matchers:
        - alertname = "InfoInhibitor"
    - receiver: ntfy-falco
      matchers:
        - source = "falco"
      group_by:
        - rule
    # Flux notification-controller events; Prometheus alerts lack this label.
    - receiver: ntfy-flux
      matchers:
        - alertname =~ "Flux.+"
        - reportingcontroller =~ ".+"
      group_by:
        - alertname
        - namespace
        - name
    - receiver: ntfy-urgent
      matchers:
        - severity = "critical"
receivers:
  # ntfy formats the Alertmanager payload itself with its built-in template.
  # max_alerts keeps the rendered message under ntfy's 4096 byte limit, which
  # ntfy answers with HTTP 400 when exceeded.
  # https://ntfy.sh/docs/publish/#pre-defined-templates
  - name: ntfy
    webhook_configs:
      - url: "https://ntfy.sh/{{ .NTFY_TOPIC }}?template=alertmanager"
        max_alerts: 2
  - name: ntfy-urgent
    webhook_configs:
      - url: "https://ntfy.sh/{{ .NTFY_TOPIC }}?template=alertmanager&priority=urgent"
        max_alerts: 2
  # Falco alerts lack the Prometheus labels ntfy's alertmanager template
  # expects, so they use an inline template instead. External Secrets renders
  # this file as a Go template: each urlquery call URL-encodes the ntfy
  # template that follows it into the t (title), p (priority) and m (message)
  # query parameters. ntfy then renders those against the webhook payload.
  # https://docs.ntfy.sh/publish/#inline-templating
  - name: ntfy-falco
    webhook_configs:
      - url: >-
          https://ntfy.sh/{{ .NTFY_TOPIC }}?tpl=1&tags=rotating_light&t={{ urlquery
            "{{ (first .alerts).labels.rule }}"
          }}&p={{ urlquery
            "{{ if eq (first .alerts).labels.severity \"critical\" }}urgent{{ else }}default{{ end }}"
          }}&m={{ urlquery
            "{{ range .alerts }}"
            "Node: {{ .labels.hostname }}\n"
            "{{ if .labels.k8s_pod_name }}Pod: {{ .labels.k8s_ns_name }}/{{ .labels.k8s_pod_name }}\n{{ end }}"
            "{{ .annotations.description }}\n\n"
            "{{ end }}"
          }}
        send_resolved: false
        max_alerts: 2
  # Flux event alerts name the object only in the kind, namespace and name
  # labels and carry the error in a message annotation, none of which ntfy's
  # alertmanager template shows. They never resolve on their own; Alertmanager
  # only expires them after resolve_timeout, so resolved notifications would
  # not mean the resource recovered. trunc keeps two long error messages under
  # ntfy's 4096 byte limit.
  # https://fluxcd.io/flux/components/notification/providers/#prometheus-alertmanager
  - name: ntfy-flux
    webhook_configs:
      - url: >-
          https://ntfy.sh/{{ .NTFY_TOPIC }}?tpl=1&t={{ urlquery
            "{{ with first .alerts }}{{ .labels.kind }} {{ .labels.namespace }}/{{ .labels.name }}: {{ .labels.reason }}{{ end }}"
          }}&m={{ urlquery
            "{{ range .alerts }}{{ .annotations.message | trunc 1500 }}\n\n{{ end }}"
          }}
        send_resolved: false
        max_alerts: 2
  - name: backup
    email_configs:
      - to: ${ADMIN_EMAIL}
        from: noreply@mail.${CLUSTER_DOMAIN}
        smarthost: send.simplemailservice.eu:587
        auth_username: "{{ .SMTP_USERNAME }}"
        auth_password: "{{ .SMTP_PASSWORD }}"
        require_tls: true
  - name: heartbeat
    webhook_configs:
      - url: "https://hc-ping.com/{{ .HEALTHCHECKSIO_UUID }}"
        send_resolved: false
        max_alerts: 1
  - name: blackhole
    webhook_configs: []
