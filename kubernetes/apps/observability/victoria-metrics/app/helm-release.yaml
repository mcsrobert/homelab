---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 30m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values: # https://docs.victoriametrics.com/helm/victoria-metrics-k8s-stack/#parameters
    fullnameOverride: victoria-metrics

    # k3s default config does not expose these
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeDns:
      enabled: false
    coreDns:
      enabled: true
    # deployed separately
    grafana:
      enabled: false

    syncJob:
      image:
        repository: ghcr.io/victoriametrics/sync-job
        tag: v0.0.17@sha256:b6f233532a85cda65e645264d24f995e5ee97f88b60610643f01f170516f444b

    victoria-metrics-operator:
      fullnameOverride: victoria-metrics-operator
      image:
        repository: victoriametrics/operator
        tag: v0.75.0@sha256:78da26b41a819093707be2ab6a65a5dc19f43d58ec52f30b49a545c2c6b7bd55
      crds:
        cleanup:
          image:
            repository: registry.k8s.io/kubectl
            tag: v1.37.0@sha256:5ed410ebac5dc976cc717098994dcdb29bbbd38f6bd65f582311f5be4ba719cf
      operator:
        enable_converter_ownership: true
      env:
        - name: VM_CONFIG_RELOADER_REQUEST_CPU
          value: 5m
        - name: VM_CONFIG_RELOADER_REQUEST_MEMORY
          value: 16Mi
        - name: VM_CONFIG_RELOADER_LIMIT_MEMORY
          value: 32Mi
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi

    vmsingle:
      enabled: true
      spec:
        image:
          repository: victoriametrics/victoria-metrics
          tag: v1.154.0@sha256:4bd592341587d669b7f57d54bbb82bd21ac8675f4e24234b7703a7c0f85197d8
        retentionPeriod: 10d
        storage:
          storageClassName: longhorn-victoria-metrics
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 192Gi
        extraArgs:
          maxLabelsPerTimeseries: "100"
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 4Gi
      ingress:
        enabled: false
      route:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Victoria Metrics
          gethomepage.dev/icon: victoriametrics
          gethomepage.dev/description: Time series database and monitoring solution
          gethomepage.dev/group: Observability
          gethomepage.dev/pod-selector: app.kubernetes.io/name=vmsingle
        hostnames:
          - victoria-metrics.${CLUSTER_DOMAIN}
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /
        filters: &authFilters
          - type: ExtensionRef
            extensionRef:
              group: traefik.io
              kind: Middleware
              name: auth-chain
        parentRefs: &parentRefs
          - name: traefik-gateway
            namespace: network
            sectionName: websecure

    alertmanager:
      enabled: true
      spec:
        image:
          repository: prom/alertmanager
          tag: v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
        externalURL: https://alertmanager.${CLUSTER_DOMAIN}
        configSecret: alertmanager-config
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 64Mi
      ingress:
        enabled: false
      route:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Alertmanager
          gethomepage.dev/icon: alertmanager
          gethomepage.dev/description: Collects, manages and sends alerts to receivers
          gethomepage.dev/group: Observability
          gethomepage.dev/pod-selector: app.kubernetes.io/name=vmalertmanager
        hostnames:
          - alertmanager.${CLUSTER_DOMAIN}
        filters: *authFilters
        parentRefs: *parentRefs

    vmalert:
      enabled: true
      spec:
        image:
          repository: victoriametrics/vmalert
          tag: v1.154.0@sha256:f11d77f9ff68dfd63c871d0e59ae7b479f9c3fd0e8a685fef690fb88b794d938
        extraArgs:
          external.url: https://vm-alert.${CLUSTER_DOMAIN}
        evaluationInterval: 15s
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
      ingress:
        enabled: false
      route:
        enabled: true
        hostnames:
          - vm-alert.${CLUSTER_DOMAIN}
        filters: *authFilters
        parentRefs: *parentRefs

    vmagent:
      enabled: true
      spec:
        image:
          repository: victoriametrics/vmagent
          tag: v1.154.0@sha256:2a939a9df9c8591aa5447efcd21af8c4f2ecc60ca6a8e742ffd46b9c76ef7f17
        extraArgs:
          promscrape.maxScrapeSize: "32MB"
          promscrape.streamParse: "true"
        scrapeInterval: 20s
        inlineRelabelConfig:
          - action: labeldrop
            regex: beta_kubernetes_io_.*
          - action: labeldrop
            regex: node(_role)?_kubernetes_io_.*
          - action: labeldrop
            regex: feature_node_kubernetes_io_.*
          - action: labeldrop
            regex: p2p_k3s_cattle_io_enabled
        resources:
          requests:
            cpu: 500m
            memory: 384Mi
          limits:
            memory: 768Mi
      ingress:
        enabled: false
      route:
        enabled: true
        hostnames:
          - vm-agent.${CLUSTER_DOMAIN}
        filters: *authFilters
        parentRefs: *parentRefs

    kube-state-metrics:
      image:
        registry: registry.k8s.io
        repository: kube-state-metrics/kube-state-metrics
        tag: v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 256Mi

    prometheus-node-exporter:
      # renovate: datasource=docker depName=quay.io/prometheus/node-exporter
      version: v1.12.1
      image:
        registry: quay.io
        repository: prometheus/node-exporter
        tag: v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 64Mi

    defaultDashboards:
      enabled: true
      annotations:
        grafana_folder: observability

    defaultRules:
      groups:
        kube-prometheus-general:
          enabled: false
        kube-scheduler:
          enabled: false
        kubernetes-system-scheduler:
          enabled: false
        kubernetes-system-controller-manager:
          enabled: false
        etcd:
          enabled: false

    extraRules:
      custom-oom:
        groups:
          - name: custom.oom
            rules:
              - alert: KubeContainerOOMKilled
                expr: |
                  (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
                  and on(namespace, pod, container) (time() - kube_pod_container_status_last_terminated_timestamp) < 600
                for: 0m
                labels:
                  severity: warning
                annotations:
                  description: Container was OOMKilled within the last 10 minutes
                  summary: Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled.
