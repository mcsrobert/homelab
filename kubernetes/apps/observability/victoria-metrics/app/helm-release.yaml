---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 30m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values: # https://docs.victoriametrics.com/helm/victoria-metrics-k8s-stack/#parameters
    fullnameOverride: victoria-metrics

    # k3s default config does not expose these
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeDns:
      enabled: false
    coreDns:
      enabled: true

    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                # large histograms that no rule or dashboard reads
                - action: drop
                  source_labels: [__name__]
                  regex: (apiserver_request_duration_seconds|apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_storage_list_duration_seconds|apiserver_watch_cache_initialization_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_dispatch_duration_seconds|apiserver_watch_events_sizes|apiserver_watch_list_duration_seconds|etcd_request_duration_seconds|scheduler_plugin_execution_duration_seconds)_bucket
                # keep the buckets the SLO rules use (1, 5, 30) and a coarse set for quantiles
                - action: drop
                  source_labels: [__name__, le]
                  regex: apiserver_request_sli_duration_seconds_bucket;(0.6|0.8|1.25|1.5|3|4|6|8|15|20|45)(\.0)?
                # k3s serves one registry on every port, these already come from the kubelet job
                - action: drop
                  source_labels: [__name__]
                  regex: (csi_operations|kubelet|kubeproxy|plugin_manager|prober|storage_operation|volume_manager)_.+

    kubelet:
      vmScrapes:
        cadvisor:
          spec:
            metricRelabelConfigs:
              # chart defaults, a list set here replaces them
              - &dropUid
                action: labeldrop
                regex: (uid)
              - &dropIdName
                action: labeldrop
                regex: (id|name)
              - &dropRestClient
                action: drop
                source_labels: [__name__]
                regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
              # per-device and kernel memory detail that no rule or dashboard reads
              - action: drop
                source_labels: [__name__]
                regex: container_(blkio_device_usage_total|fs_(inodes_.+|io_.+|limit_bytes|read_seconds_total|reads_merged_total|sector_.+|write_seconds_total|writes_merged_total)|memory_(events_.+|failcnt|failures_total|file_.+|kernel_usage|mapped_file|max_usage_bytes|pgscan_total|pgsteal_total|total_.+|workingset_refault_.+))
        kubelet:
          spec:
            metricRelabelConfigs:
              - *dropUid
              - *dropIdName
              - *dropRestClient
              # k3s serves the embedded control plane's metrics here too, the apiserver job already scrapes them
              - action: drop
                source_labels: [__name__]
                regex: (aggregator|apiextensions|apiserver|authentication|authorization|etcd|field_validation|scheduler|watch_cache)_.+
    # deployed separately
    grafana:
      enabled: false

    victoria-metrics-operator:
      fullnameOverride: victoria-metrics-operator
      operator:
        enable_converter_ownership: true
      env:
        - name: VM_CONFIG_RELOADER_REQUEST_CPU
          value: 5m
        - name: VM_CONFIG_RELOADER_REQUEST_MEMORY
          value: 16Mi
        - name: VM_CONFIG_RELOADER_LIMIT_MEMORY
          value: 32Mi
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi

    vmsingle:
      enabled: true
      spec:
        retentionPeriod: 90d
        storage:
          storageClassName: longhorn-no-backup-single-replication
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
        extraArgs:
          maxLabelsPerTimeseries: "100"
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 4Gi
      ingress:
        enabled: false
      route:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Victoria Metrics
          gethomepage.dev/icon: victoriametrics
          gethomepage.dev/description: Time series database and monitoring solution
          gethomepage.dev/group: Observability
          gethomepage.dev/pod-selector: app.kubernetes.io/name=vmsingle
        hostnames:
          - victoria-metrics.${CLUSTER_DOMAIN}
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /
        filters: &authFilters
          - type: ExtensionRef
            extensionRef:
              group: traefik.io
              kind: Middleware
              name: auth-chain
        parentRefs: &parentRefs
          - name: traefik-gateway
            namespace: network
            sectionName: websecure

    alertmanager:
      enabled: true
      spec:
        externalURL: https://alertmanager.${CLUSTER_DOMAIN}
        configSecret: alertmanager-config
        configReloaderResources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 128Mi
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
      ingress:
        enabled: false
      route:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Alertmanager
          gethomepage.dev/icon: alertmanager
          gethomepage.dev/description: Collects, manages and sends alerts to receivers
          gethomepage.dev/group: Observability
          gethomepage.dev/pod-selector: app.kubernetes.io/name=vmalertmanager
        hostnames:
          - alertmanager.${CLUSTER_DOMAIN}
        filters: *authFilters
        parentRefs: *parentRefs

    vmalert:
      enabled: true
      spec:
        extraArgs:
          external.url: https://vm-alert.${CLUSTER_DOMAIN}
        evaluationInterval: 15s
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
      ingress:
        enabled: false
      route:
        enabled: true
        hostnames:
          - vm-alert.${CLUSTER_DOMAIN}
        filters: *authFilters
        parentRefs: *parentRefs

    vmagent:
      enabled: true
      spec:
        extraArgs:
          promscrape.maxScrapeSize: "32MB"
          promscrape.streamParse: "true"
        scrapeInterval: 30s
        inlineRelabelConfig:
          # Unused buckets; retain sums/counts for rates and averages.
          - action: drop
            source_labels: [__name__]
            regex: (rest_client_(request_size_bytes|response_size_bytes|rate_limiter_duration_seconds)|workqueue_work_duration_seconds)_bucket
          # The API-server dashboard uses queue latency quantiles.
          - action: drop
            if: '{job!="apiserver"}'
            source_labels: [__name__]
            regex: workqueue_queue_duration_seconds_bucket
          - action: drop
            if: '{job="grafana"}'
            source_labels: [__name__]
            regex: grafana_.*_bucket
          - action: labeldrop
            regex: beta_kubernetes_io_.*
          - action: labeldrop
            regex: node(_role)?_kubernetes_io_.*
          - action: labeldrop
            regex: feature_node_kubernetes_io_.*
          - action: labeldrop
            regex: p2p_k3s_cattle_io_enabled
          # same on every node or a copy of the node label
          - action: labeldrop
            regex: kubernetes_io_(arch|hostname|os)
        resources:
          requests:
            cpu: 500m
            memory: 384Mi
          limits:
            memory: 768Mi
      ingress:
        enabled: false
      route:
        enabled: true
        hostnames:
          - vm-agent.${CLUSTER_DOMAIN}
        filters: *authFilters
        parentRefs: *parentRefs

    kube-state-metrics:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 256Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 64Mi

    defaultDashboards:
      enabled: true
      annotations:
        grafana_folder: observability

    defaultRules:
      groups:
        kube-prometheus-general:
          enabled: false
        kube-scheduler:
          enabled: false
        kubernetes-system-scheduler:
          enabled: false
        kubernetes-system-controller-manager:
          enabled: false
        etcd:
          enabled: false

    extraRules:
      custom-cache-pressure:
        groups:
          - name: custom.cache-pressure
            rules:
              - alert: KubeContainerFileCachePressure
                expr: |
                  (container_memory_usage_bytes{container!="",pod!=""} / on(namespace,pod,container) group_left kube_pod_container_resource_limits{resource="memory"} > 0.95)
                  and on(namespace,pod,container) (container_memory_cache{container!="",pod!=""} > 10485760)
                  and on(namespace,pod,container) (rate(container_fs_reads_bytes_total{container!="",pod!=""}[5m]) > 1048576)
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: Container {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) may be thrashing its file cache.
                  description: Container memory usage has remained above 95% of its limit, with more than 10 MiB of file cache and sustained filesystem reads above 1 MiB/s. Check cgroup memory pressure and disk activity on {{ $labels.node }}.
      custom-oom:
        groups:
          - name: custom.oom
            rules:
              - alert: KubeContainerOOMKilled
                expr: |
                  (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
                  and on(namespace, pod, container) (time() - kube_pod_container_status_last_terminated_timestamp) < 600
                for: 0m
                labels:
                  severity: warning
                annotations:
                  description: Container was OOMKilled within the last 10 minutes
                  summary: Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled.
