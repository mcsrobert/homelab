---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.2-standalone-strict/networkpolicy.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmsingle-ingress
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
      app.kubernetes.io/instance: victoria-metrics
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
              app.kubernetes.io/instance: victoria-metrics
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
              app.kubernetes.io/instance: victoria-metrics
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmauth
              app.kubernetes.io/instance: readonly
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: grafana
      ports:
        - port: 8428
          protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.2-standalone-strict/networkpolicy.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmagent-ingress
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels: &vmagent
      app.kubernetes.io/name: vmagent
      app.kubernetes.io/instance: victoria-metrics
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmauth
              app.kubernetes.io/instance: readonly
      ports:
        - port: 8429
          protocol: TCP
    - from:
        - podSelector:
            matchLabels: *vmagent
      ports:
        - port: 8429
          protocol: TCP
        - port: 8435
          protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.2-standalone-strict/networkpolicy.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmalert-ingress
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmalert
      app.kubernetes.io/instance: victoria-metrics
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmauth
              app.kubernetes.io/instance: readonly
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmsingle
              app.kubernetes.io/instance: victoria-metrics
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
              app.kubernetes.io/instance: victoria-metrics
      ports:
        - port: 8080
          protocol: TCP
        - port: 8435
          protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.2-standalone-strict/networkpolicy.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmalertmanager-ingress
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels: &vmalertmanager
      app.kubernetes.io/name: vmalertmanager
      app.kubernetes.io/instance: victoria-metrics
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security
          podSelector:
            matchLabels:
              app.kubernetes.io/name: falcosidekick
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
          podSelector:
            matchLabels:
              app: notification-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
              app.kubernetes.io/instance: victoria-metrics
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: grafana
      ports:
        - port: 9093
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
              app.kubernetes.io/instance: victoria-metrics
      ports:
        - port: 9093
          protocol: TCP
        - port: 8435
          protocol: TCP
    - from:
        - podSelector:
            matchLabels: *vmalertmanager
      ports:
        - port: 9094
          protocol: TCP
        - port: 9094
          protocol: UDP
