---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name alertmanager-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: *name
    template:
      templateFrom:
        - configMap:
            name: alertmanager-config-template
            items:
              - key: alertmanager.yaml
  data:
    - secretKey: ALERTMANAGER_NTFY_USERNAME
      remoteRef:
        key: alertmanager-ntfy
        property: USERNAME
    - secretKey: ALERTMANAGER_NTFY_PASSWORD
      remoteRef:
        key: alertmanager-ntfy
        property: PASSWORD
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: simplemailservice/alertmanager
        property: USERNAME
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: simplemailservice/alertmanager
        property: PASSWORD
