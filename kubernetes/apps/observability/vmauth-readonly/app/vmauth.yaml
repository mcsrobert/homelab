---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/operator.victoriametrics.com/vmauth_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: readonly
spec:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  unauthorizedUserAccessSpec:
    # Backends share query and admin ports. Keep path regexes narrow to block traversal to write endpoints.
    targetRefs:
      - static:
          url: http://vmsingle-victoria-metrics:8428
        paths:
          - /api/v1/query
          - /api/v1/query_range
          - /api/v1/series
          - /api/v1/labels
          - /api/v1/label/[^/]+/values
          - /api/v1/metadata
          - /api/v1/status/(tsdb|top_queries|active_queries)
      - static:
          url: http://vmagent-victoria-metrics:8429
        paths:
          - /api/v1/targets
      - static:
          url: http://vmalert-victoria-metrics:8080
        paths:
          - /api/v1/alerts
          - /api/v1/rules
      - static:
          url: http://victoria-logs-server:9428
        paths:
          - /select/logsql/[a-z_]+
