---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.2-standalone-strict/networkpolicy.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmauth-readonly-ingress
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmauth
      app.kubernetes.io/instance: readonly
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: development
          podSelector:
            matchLabels:
              app.kubernetes.io/name: t3-code
      ports:
        - port: 8427
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
              app.kubernetes.io/instance: victoria-metrics
      ports:
        - port: 8427
          protocol: TCP
        - port: 8435
          protocol: TCP
