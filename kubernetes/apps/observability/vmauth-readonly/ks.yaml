---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vmauth-readonly
  namespace: flux-system
spec:
  dependsOn:
    # Provides the VMAuth CRD.
    - name: victoria-metrics
  path: /kubernetes/apps/observability/vmauth-readonly/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: observability
  interval: 30m
  retryInterval: 3m
  timeout: 5m
  wait: true
  prune: true

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vmauth-readonly-falco
  namespace: flux-system
spec:
  dependsOn:
    - name: falco-operator
  path: /kubernetes/apps/observability/vmauth-readonly/falco
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: security
  interval: 30m
  timeout: 5m
  prune: true
