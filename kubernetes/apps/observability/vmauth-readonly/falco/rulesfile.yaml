---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: vmauth-readonly-exceptions
spec:
  priority: 60
  inlineRules:
    # Both config sidecars report /app as the executable in Falco events.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: vmauth_readonly_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
          comps: [=, startswith, =, in, =]
          values:
            - - observability
              - vmauth-readonly-
              - docker.io/victoriametrics/operator
              - [config-init, config-reloader]
              - /app
      override:
        exceptions: append
