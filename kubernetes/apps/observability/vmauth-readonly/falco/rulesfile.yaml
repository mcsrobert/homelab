---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: vmauth-readonly-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # The generated config sidecars read Secrets for vmauth configuration.
    - macro: k8s_containers
      override:
        condition: append
      condition: >
        or (k8s.ns.name = "observability"
        and container.image.repository = "docker.io/victoriametrics/operator"
        and container.name in ("config-init", "config-reloader")
        and k8s.pod.name startswith "vmauth-readonly-")
