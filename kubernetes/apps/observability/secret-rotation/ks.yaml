---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secret-rotation
  namespace: flux-system
spec:
  dependsOn:
    - name: victoria-metrics
  path: /kubernetes/apps/observability/secret-rotation/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: observability
  interval: 30m
  retryInterval: 3m
  timeout: 5m
  prune: true
