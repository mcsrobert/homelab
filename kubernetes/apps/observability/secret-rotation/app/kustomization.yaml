---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./service-account.yaml
  - ./cluster-role.yaml
  - ./cluster-role-binding.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./vm-service-scrape.yaml
  - ./vm-rule.yaml
configMapGenerator:
  - name: secret-rotation-code
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ./resources/exporter.js
