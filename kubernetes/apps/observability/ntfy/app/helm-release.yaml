---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      ntfy:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 5000
            runAsGroup: 5000
            fsGroup: 5000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          ntfy:
            image:
              repository: docker.io/binwiederhier/ntfy
              tag: v2.37.2@sha256:1875ddcf815c8a3c981d6d78c67a93452d0abba79b1ab9520b1f5f5238902bd7
            args:
              - serve
            # Docs: https://docs.ntfy.sh/config/
            env:
              TZ: ${TIME_ZONE}
              NTFY_BASE_URL: https://ntfy.${CLUSTER_DOMAIN}
              NTFY_LISTEN_HTTP: :8080
              NTFY_BEHIND_PROXY: true
              NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 8080
                    path: /v1/health
              readiness: *probe
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/ntfy
    service:
      ntfy:
        controller: ntfy
        ports:
          http:
            port: 80
            targetPort: *port
            protocol: HTTP
    route:
      ntfy:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: ntfy
          gethomepage.dev/icon: ntfy
          gethomepage.dev/description: Push notifications for alerts
          gethomepage.dev/group: Observability
          gethomepage.dev/pod-selector: app.kubernetes.io/name = ntfy
        hostnames:
          - ntfy.${CLUSTER_DOMAIN}
        rules:
          - backendRefs:
              - identifier: ntfy
        parentRefs:
          - name: traefik-gateway
            namespace: network
            sectionName: websecure
