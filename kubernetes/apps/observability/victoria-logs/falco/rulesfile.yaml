---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: victoria-logs-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # Victoria Logs collector vlagent (observability) watches pods to label log streams.
    - rule: Contact K8S API Server From Container
      exceptions:
        # PR #1253; retained Nov 5-6 API events identify the collector executable.
        - name: victoria_logs_api_clients
          fields:
            - container.image.repository
            - k8s.ns.name
            - container.name
            - k8s.pod.name
            - proc.name
            - proc.exepath
          comps: [=, =, =, startswith, =, =]
          values:
            - - docker.io/victoriametrics/vlagent
              - observability
              - vlagent
              - victoria-logs-collector-
              - vlagent-prod
              - /vlagent-prod
      override:
        exceptions: append
