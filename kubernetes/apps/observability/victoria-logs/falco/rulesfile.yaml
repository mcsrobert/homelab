---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: victoria-logs-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # Victoria Logs collector vlagent (observability) watches pods to label log streams.
    - macro: k8s_containers
      override:
        condition: append
      condition: >
        or (container.image.repository = "docker.io/victoriametrics/vlagent" and k8s.ns.name = "observability" and container.name = "vlagent" and k8s.pod.name startswith "victoria-logs-collector-")
