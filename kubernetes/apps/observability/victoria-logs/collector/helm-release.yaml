---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs-collector
  interval: 30m
  values: # https://docs.victoriametrics.com/helm/victoria-logs-collector/#parameters
    image:
      repository: victoriametrics/vlagent
      tag: v1.53.0@sha256:a82f93ffecc153fb068606903e512368b070272739d823abe99fad0eff6e1849
    remoteWrite:
      - url: http://victoria-logs-server.{{ .Release.Namespace }}.svc.cluster.local:9428
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi
    podMonitor:
      enabled: true
      vm: true
