---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcpy
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      hcpy:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # TODO: If I ever use Multus, remove these
          hostAliases:
            - ip: ${DISHWASHER_IP}
              hostnames: ["dishwasher"]
            - ip: ${OVEN_IP}
              hostnames: ["oven"]
            - ip: ${WASHER_IP}
              hostnames: ["washer"]
            - ip: ${DRYER_IP}
              hostnames: ["dryer"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 12020
            runAsGroup: 12020
            fsGroup: 12020
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          hcpy:
            image:
              repository: ghcr.io/hcpy2-0/hcpy
              tag: v0.4.12@sha256:12c6033b31983c643685dd33a1804ef64aba422a01a9990d0e5356fbe7834ca9
            probes:
              # hcpy has no health endpoint, and it already exits on its own when it cannot reach
              # mosquitto at startup. So only report readiness, never restart: the check passes while
              # there is an ESTABLISHED TCP connection to the MQTT port (1883 = 0x075B in
              # /proc/net/tcp, field 3 is the remote address, state 01 is ESTABLISHED).
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - awk
                      - $4 == "01" && $3 ~ /:075B$/ { found = 1 } END { exit !found }
                      - /proc/net/tcp
                  periodSeconds: 30
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        type: secret
        name: hcpy-config
        globalMounts:
          - path: /app/config
