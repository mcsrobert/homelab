---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
    - name: gateway-api-crds
  path: /kubernetes/apps/home-automation/home-assistant/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: home-automation
  prune: true
  interval: 15m
  timeout: 10m
  wait: true

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant-falco
  namespace: flux-system
spec:
  dependsOn:
    - name: falco-operator
  path: /kubernetes/apps/home-automation/home-assistant/falco
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: security
  interval: 30m
  timeout: 5m
  prune: true
