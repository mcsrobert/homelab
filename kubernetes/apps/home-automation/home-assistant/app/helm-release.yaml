---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  # ha-git-sync moves the configuration it replaces to *.pre-git, which rolling back the Helm release does not undo.
  # https://github.com/mcsrobert/ha-git-sync/blob/v0.3.1/README.md#what-gets-written-where
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: false
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 12000
            runAsGroup: 12000
            fsGroup: 12000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          git-sync:
            image:
              repository: ghcr.io/mcsrobert/ha-git-sync
              tag: 0.4.0@sha256:26698fb4fae71878190f14139e6860fc9934233a953a7979bf0ab19026907cde
            restartPolicy: Always
            env:
              GITSYNC_REPO: https://github.com/mcsrobert/home-assistant-config.git
              GITSYNC_GITHUB_APP_APPLICATION_ID:
                valueFrom:
                  secretKeyRef:
                    name: &secret home-assistant-git-sync
                    key: github-app-id
              GITSYNC_GITHUB_APP_INSTALLATION_ID:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: github-app-installation-id
              GITSYNC_GITHUB_APP_PRIVATE_KEY_FILE: /etc/git-secret/github-app-key
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /ha-git-sync/ready
                  periodSeconds: 5
                  failureThreshold: 120
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              runAsUser: 65533
              runAsGroup: 65533
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          home-assistant:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.11.2@sha256:28ae630554f1f2dd43ecbdecad9d974f09f02b17a0a769a290ceec094ec427dc
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
              readiness: *probe
              startup:
                enabled: true
                type: HTTP
                spec:
                  periodSeconds: 10
                  failureThreshold: 18
            resources:
              requests:
                cpu: 100m
                memory: 500Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      home-assistant-config:
        existingClaim: home-assistant-config
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /config
            git-sync:
              - path: /config
      git-sync-secret:
        type: secret
        name: *secret
        defaultMode: 288 # 0440
        advancedMounts:
          home-assistant:
            git-sync:
              - path: /etc/git-secret
                readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /tmp
      git-sync-tmp:
        type: emptyDir
        sizeLimit: 256Mi
        advancedMounts:
          home-assistant:
            git-sync:
              - path: /tmp
    service:
      home-assistant:
        primary: true
        ports:
          http:
            port: 8123
            protocol: HTTP
    route:
      home-assistant:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Home Assistant
          gethomepage.dev/icon: home-assistant
          gethomepage.dev/description: Local smart home control and automation
          gethomepage.dev/group: Home Automation
          gethomepage.dev/app: home-assistant
        hostnames:
          - homeassistant.${CLUSTER_DOMAIN}
        rules:
          - backendRefs:
              - identifier: home-assistant
        parentRefs:
          - name: traefik-gateway
            namespace: network
            sectionName: websecure
