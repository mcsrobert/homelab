---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 12000
            runAsGroup: 12000
            fsGroup: 12000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          config-scanner:
            image:
              repository: ghcr.io/gitleaks/gitleaks
              tag: v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
            command: ["/bin/sh", "-ec"]
            args: ['cp "$(command -v gitleaks)" /scanner/gitleaks']
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        containers:
          home-assistant:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.4@sha256:81271a8bbe2a6019659e9d5cde98b884dd0d67fad6819bb4ab177dceb0c1c5e1
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
              readiness: *probe
              startup:
                enabled: true
                type: HTTP
                spec:
                  periodSeconds: 10
                  failureThreshold: 18
            resources:
              requests:
                cpu: 100m
                memory: 500Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          hass-configurator:
            image: &configuratorImage
              repository: causticlab/hass-configurator-docker
              tag: 0.6.0@sha256:06f064f1b4a5b17d8095e8565ae334267c4af9c6eaae19b4da536959ea6498b8
            env:
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hass-configurator-git-auth
                    key: GH_TOKEN
              GIT_TERMINAL_PROMPT: "0"
              GIT_CONFIG_COUNT: "3"
              GIT_CONFIG_KEY_0: credential.https://github.com.helper
              GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && test -n "$GH_TOKEN" && printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f'
              GIT_CONFIG_KEY_1: user.name
              GIT_CONFIG_VALUE_1: Maurice Robert
              GIT_CONFIG_KEY_2: user.email
              GIT_CONFIG_VALUE_2: 42997116+mcsrobert@users.noreply.github.com
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          config-reconciler:
            image: *configuratorImage
            command: ["python3", "/opt/reconciler/reconcile.py"]
            env:
              MODE: observe
              POLL_SECONDS: "60"
              SETTLE_SECONDS: "10"
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hass-configurator-git-auth
                    key: GH_TOKEN
              HOME: /tmp
            probes:
              liveness: &reconcilerProbe
                enabled: true
                type: HTTP
                path: /healthz
                port: 9090
              readiness: *reconcilerProbe
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    persistence:
      home-assistant-config:
        existingClaim: home-assistant-config
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /config
            config-reconciler:
              - path: /live
                # Remove readOnly only in a reviewed deploy-mode rollout.
                readOnly: true
            hass-configurator:
              - path: /home-assistant-config
      config-reconciler-state:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          home-assistant:
            config-reconciler:
              - path: /state
      config-reconciler-code:
        type: configMap
        name: home-assistant-config-reconciler
        defaultMode: 365
        advancedMounts:
          home-assistant:
            config-reconciler:
              - path: /opt/reconciler
      config-scanner:
        type: emptyDir
        sizeLimit: 64Mi
        advancedMounts:
          home-assistant:
            config-scanner:
              - path: /scanner
            config-reconciler:
              - path: /scanner
                readOnly: true
      config-reconciler-tmp:
        type: emptyDir
        sizeLimit: 64Mi
        advancedMounts:
          home-assistant:
            config-reconciler:
              - path: /tmp
      hass-configurator-config:
        type: secret
        name: hass-configurator-config
        advancedMounts:
          home-assistant:
            hass-configurator:
              - path: /config
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /tmp
      hass-configurator-tmp:
        type: emptyDir
        sizeLimit: 256Mi
        advancedMounts:
          home-assistant:
            hass-configurator:
              - path: /tmp
    service:
      home-assistant:
        primary: true
        ports:
          http:
            port: 8123
            protocol: HTTP
      config-reconciler:
        controller: home-assistant
        ports:
          metrics:
            port: 9090
      configurator:
        ports:
          http:
            port: 3218
            protocol: HTTP
    serviceMonitor:
      config-reconciler:
        service:
          identifier: config-reconciler
        endpoints:
          - port: metrics
    route:
      home-assistant:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Home Assistant
          gethomepage.dev/icon: home-assistant
          gethomepage.dev/description: Local smart home control and automation
          gethomepage.dev/group: Home Automation
          gethomepage.dev/app: home-assistant
        hostnames:
          - &host homeassistant.${CLUSTER_DOMAIN}
        rules:
          - backendRefs:
              - identifier: home-assistant
        parentRefs: &parentRefs
          - name: traefik-gateway
            namespace: network
            sectionName: websecure
      configurator:
        hostnames:
          - *host
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /code/
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: auth-chain
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /
            backendRefs:
              - identifier: configurator
        parentRefs: *parentRefs
