---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 12000
            runAsGroup: 12000
            fsGroup: 12000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          git-sync:
            image:
              repository: ghcr.io/mcsrobert/ha-git-sync
              tag: 0.1.0@sha256:a2018aa1c386789a142dabd725d9d1a2cfdb437420c13ace56959f55c3eb0f95
            restartPolicy: Always
            env:
              GITSYNC_REPO: git@github.com:mcsrobert/home-assistant-config.git
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /ha-git-sync/ready
                  periodSeconds: 5
                  failureThreshold: 120
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              runAsUser: 65533
              runAsGroup: 65533
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          home-assistant:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.4@sha256:81271a8bbe2a6019659e9d5cde98b884dd0d67fad6819bb4ab177dceb0c1c5e1
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
              readiness: *probe
              startup:
                enabled: true
                type: HTTP
                spec:
                  periodSeconds: 10
                  failureThreshold: 18
            resources:
              requests:
                cpu: 100m
                memory: 500Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      home-assistant-config:
        existingClaim: home-assistant-config
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /config
            git-sync:
              - path: /config
      git-sync-secret:
        type: secret
        name: home-assistant-git-sync
        defaultMode: 288 # 0440
        advancedMounts:
          home-assistant:
            git-sync:
              - path: /etc/git-secret
                readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /tmp
      git-sync-tmp:
        type: emptyDir
        sizeLimit: 256Mi
        advancedMounts:
          home-assistant:
            git-sync:
              - path: /tmp
    service:
      home-assistant:
        primary: true
        ports:
          http:
            port: 8123
            protocol: HTTP
    route:
      home-assistant:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Home Assistant
          gethomepage.dev/icon: home-assistant
          gethomepage.dev/description: Local smart home control and automation
          gethomepage.dev/group: Home Automation
          gethomepage.dev/app: home-assistant
        hostnames:
          - homeassistant.${CLUSTER_DOMAIN}
        rules:
          - backendRefs:
              - identifier: home-assistant
        parentRefs:
          - name: traefik-gateway
            namespace: network
            sectionName: websecure
