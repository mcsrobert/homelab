---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 12000
            runAsGroup: 12000
            fsGroup: 12000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          home-assistant:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.4@sha256:81271a8bbe2a6019659e9d5cde98b884dd0d67fad6819bb4ab177dceb0c1c5e1
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
              readiness: *probe
              startup:
                enabled: true
                type: HTTP
                spec:
                  periodSeconds: 10
                  failureThreshold: 18
            resources:
              requests:
                cpu: 100m
                memory: 500Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          hass-configurator:
            image:
              repository: causticlab/hass-configurator-docker
              tag: 0.6.0@sha256:06f064f1b4a5b17d8095e8565ae334267c4af9c6eaae19b4da536959ea6498b8
            env:
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hass-configurator-git-auth
                    key: GH_TOKEN
              GIT_TERMINAL_PROMPT: "0"
              GIT_CONFIG_COUNT: "3"
              GIT_CONFIG_KEY_0: credential.https://github.com.helper
              GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && test -n "$GH_TOKEN" && printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f'
              GIT_CONFIG_KEY_1: user.name
              GIT_CONFIG_VALUE_1: Maurice Robert
              GIT_CONFIG_KEY_2: user.email
              GIT_CONFIG_VALUE_2: 42997116+mcsrobert@users.noreply.github.com
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      home-assistant-config:
        type: persistentVolumeClaim
        forceRename: home-assistant-config
        retain: true
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 8Gi
        volumeName: home-assistant-data
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /config
            hass-configurator:
              - path: /home-assistant-config
      hass-configurator-config:
        type: secret
        name: hass-configurator-config
        advancedMounts:
          home-assistant:
            hass-configurator:
              - path: /config
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /tmp
      hass-configurator-tmp:
        type: emptyDir
        sizeLimit: 256Mi
        advancedMounts:
          home-assistant:
            hass-configurator:
              - path: /tmp
    service:
      home-assistant:
        primary: true
        ports:
          http:
            port: 8123
            protocol: HTTP
      configurator:
        ports:
          http:
            port: 3218
            protocol: HTTP
    route:
      home-assistant:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Home Assistant
          gethomepage.dev/icon: home-assistant
          gethomepage.dev/description: Local smart home control and automation
          gethomepage.dev/group: Home Automation
          gethomepage.dev/app: home-assistant
        hostnames:
          - &host homeassistant.${CLUSTER_DOMAIN}
        rules:
          - backendRefs:
              - identifier: home-assistant
        parentRefs: &parentRefs
          - name: traefik-gateway
            namespace: network
            sectionName: websecure
      configurator:
        hostnames:
          - *host
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /code/
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: auth-chain
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /
            backendRefs:
              - identifier: configurator
        parentRefs: *parentRefs
