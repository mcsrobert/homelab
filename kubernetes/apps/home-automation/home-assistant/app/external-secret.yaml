---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name home-assistant-git-sync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: *name
  data:
    - secretKey: github-app-id
      remoteRef:
        key: &github github/home-assistant-config
        property: APP_ID
    - secretKey: github-app-installation-id
      remoteRef:
        key: *github
        property: INSTALLATION_ID
    - secretKey: github-app-key
      remoteRef:
        key: *github
        property: APP_KEY
    - secretKey: ha-token
      remoteRef:
        key: home-assistant/api/git-sync
        property: ACCESS_TOKEN
