---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./external-secret.yaml
  - ./helm-release.yaml
  - ./prometheus-rule.yaml
configMapGenerator:
  - name: home-assistant-config-reconciler
    files:
      - gitleaks.toml=./resources/reconciler/gitleaks.toml
      - pre-commit=./resources/reconciler/pre-commit
      - reconcile.py=./resources/reconciler/reconcile.py
  - name: hass-configurator-config-template
    files:
      - settings.conf=./resources/hass-configurator-settings.json
configurations:
  - ./kustomize-config.yaml
