---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-volume-usage
spec:
  groups:
    - name: longhorn.volumes
      rules:
        - alert: LonghornVolumeUsageHigh
          expr: |
            longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes
            >= 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Longhorn volume {{ $labels.volume }} is {{ $value | humanizePercentage }} full
            description: >-
              Volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) on node
              {{ $labels.node }} has reached {{ $value | humanizePercentage }} of its capacity.
    - name: longhorn.backups
      rules:
        - alert: LonghornBackupFailed
          expr: longhorn_backup_state{recurring_job!=""} == 4
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Longhorn backup of volume {{ $labels.volume }} failed
            description: >-
              Backup {{ $labels.backup }} of volume {{ $labels.volume }} (recurring job
              {{ $labels.recurring_job }}) is in the Error state. Check the backup target and the
              longhorn-manager logs.
