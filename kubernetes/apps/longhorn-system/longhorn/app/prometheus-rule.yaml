---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-volume-usage
spec:
  groups:
    - name: longhorn.backups
      rules:
        - alert: LonghornBackupFailed
          expr: longhorn_backup_state{recurring_job!=""} == 4
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Longhorn backup of volume {{ $labels.volume }} failed
            description: >-
              Backup {{ $labels.backup }} of volume {{ $labels.volume }} (recurring job
              {{ $labels.recurring_job }}) is in the Error state. Check the backup target and the
              longhorn-manager logs.
