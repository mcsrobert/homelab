---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: longhorn-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # Longhorn (longhorn-system) manager, CSI plugin, CSI attacher, provisioner, resizer and snapshotter, and recurring-job pods reconcile its CRDs and volumes.
    - rule: Contact K8S API Server From Container
      exceptions:
        # PR #1263 and retained Nov 5-6 events; PR #1283 captured attacher/snapshotter paths.
        - name: longhorn_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
          comps: [=, startswith, =, =, =, =]
          values:
            - - longhorn-system
              - longhorn-manager-
              - docker.io/longhornio/longhorn-manager
              - longhorn-manager
              - longhorn-manage
              - /usr/local/sbin/longhorn-manager
            - - longhorn-system
              - longhorn-csi-plugin-
              - docker.io/longhornio/longhorn-manager
              - longhorn-csi-plugin
              - longhorn-manage
              - /usr/local/sbin/longhorn-manager
            - - longhorn-system
              - csi-attacher-
              - docker.io/longhornio/csi-attacher
              - csi-attacher
              - csi-attacher
              - /csi-attacher
            - - longhorn-system
              - csi-provisioner-
              - docker.io/longhornio/csi-provisioner
              - csi-provisioner
              - csi-provisioner
              - /csi-provisioner
            - - longhorn-system
              - csi-resizer-
              - docker.io/longhornio/csi-resizer
              - csi-resizer
              - csi-resizer
              - /csi-resizer
            - - longhorn-system
              - csi-snapshotter-
              - docker.io/longhornio/csi-snapshotter
              - csi-snapshotter
              - csi-snapshotter
              - /csi-snapshotter
            - - longhorn-system
              - snapshot-
              - docker.io/longhornio/longhorn-manager
              - snapshot
              - longhorn-manage
              - /usr/local/sbin/longhorn-manager
            - - longhorn-system
              - backup-
              - docker.io/longhornio/longhorn-manager
              - backup
              - longhorn-manage
              - /usr/local/sbin/longhorn-manager
      override:
        exceptions: append
    # The instance manager's engine runs iscsiadm to attach volumes, and iscsiadm
    # loads the iSCSI kernel modules (finit_module) while discovering targets.
    - rule: Linux Kernel Module Injection Detected
      exceptions:
        - name: longhorn_iscsi_modules
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
          comps: [=, startswith, =, =, =, =]
          values:
            - - longhorn-system
              - instance-manager-
              - docker.io/longhornio/longhorn-instance-manager
              - instance-manager
              - iscsiadm
              - /usr/sbin/iscsiadm
      override:
        exceptions: append
