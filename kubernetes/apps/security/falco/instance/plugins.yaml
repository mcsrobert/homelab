---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Plugin
metadata:
  name: container
spec:
  ociArtifact:
    image:
      repository: falcosecurity/plugins/plugin/container
      # renovate: datasource=docker depName=ghcr.io/falcosecurity/plugins/plugin/container
      tag: 0.7.6
  config:
    initConfig:
      engines:
        docker:
          enabled: false
        podman:
          enabled: false
        containerd:
          enabled: true
          sockets:
            - /run/k3s/containerd/containerd.sock
        cri:
          enabled: false
        lxc:
          enabled: false
        libvirt_lxc:
          enabled: false
        bpm:
          enabled: false
---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Plugin
metadata:
  name: k8smeta
spec:
  ociArtifact:
    image:
      repository: falcosecurity/plugins/plugin/k8smeta
      # renovate: datasource=docker depName=ghcr.io/falcosecurity/plugins/plugin/k8smeta
      tag: 0.4.2
  config:
    initConfig:
      collectorHostname: metacollector.security.svc
      collectorPort: 45000
      nodeName: $${FALCO_K8S_NODE_NAME}
