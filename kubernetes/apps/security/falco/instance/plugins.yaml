---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Plugin
metadata:
  name: container
spec:
  ociArtifact:
    image:
      repository: falcosecurity/plugins/plugin/container
      tag: 0.7.5
    registry:
      name: ghcr.io
  config:
    initConfig:
      engines:
        docker:
          enabled: false
        podman:
          enabled: false
        containerd:
          enabled: true
          sockets:
            - /run/k3s/containerd/containerd.sock
        cri:
          enabled: false
        lxc:
          enabled: false
        libvirt_lxc:
          enabled: false
        bpm:
          enabled: false
