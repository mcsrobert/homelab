---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: falco-rules-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  # Keep only host-level exceptions here (including host-managed static pods).
  # App-specific exceptions belong in that app's falco/rulesfile.yaml, applied
  # by its own <app>-falco Flux Kustomization targeting security and depending
  # on falco-operator. See system/keda/falco for an example.
  # Scope exceptions to namespace, image repository and container, adding a
  # stable workload pod prefix for shared sidecars (see dragonfly-operator/falco).
  # Match the expected process/executable and event fields where available;
  # verify ownership from manifests or events, not just comments or location.
  inlineRules:
    # Armbian's ramlog postrotate job runs on the RK1 host (not in a container)
    # and truncates /var/log, which the stock log-clearing rule would flag.
    - rule: Clear Log Activities
      exceptions:
        - name: armbian_ramlog_postrotate
          fields:
            - container.id
            - proc.name
            - proc.exepath
            - proc.cmdline
            - proc.pname
            - user.uid
            - fd.directory
          comps: [=, =, =, =, =, =, =]
          values:
            - - host
              - armbian-ramlog
              - /usr/bin/bash
              - armbian-ramlog /usr/lib/armbian/armbian-ramlog postrotate
              - armbian-ramlog
              - 0
              - /var/log
      override:
        exceptions: append
    # kube-vip opens a packet socket to send gratuitous ARP for the control-plane
    # VIP, which is how it fails over between nodes.
    - rule: Packet socket created in container
      exceptions:
        - name: kube_vip_arp
          fields:
            - k8s.ns.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
            - evt.arg.type
            - evt.arg.proto
          comps: [=, =, =, =, =, =, =]
          values:
            - - kube-system
              - ghcr.io/kube-vip/kube-vip
              - kube-vip
              - kube-vip
              - /kube-vip
              - 2
              - 1544
      override:
        exceptions: append
