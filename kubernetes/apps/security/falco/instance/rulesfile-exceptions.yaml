---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: falco-rules-exceptions
spec:
  # Exception Rulesfiles load after the upstream rules at priority 50.
  priority: 60
  # App exception Kustomizations target security and depend on falco-operator.
  inlineRules:
    # Armbian's host ramlog job truncates logs after rotation.
    - rule: Clear Log Activities
      exceptions:
        - name: armbian_ramlog_postrotate
          fields:
            - container.id
            - proc.name
            - proc.exepath
            - proc.cmdline
            - proc.pname
            - user.uid
            - fd.directory
          comps: [=, =, =, =, =, =, =]
          values:
            - - host
              - armbian-ramlog
              - /usr/bin/bash
              - armbian-ramlog /usr/lib/armbian/armbian-ramlog postrotate
              - armbian-ramlog
              - 0
              - /var/log
      override:
        exceptions: append
    # kube-vip sends gratuitous ARP for the control-plane VIP during failover.
    - rule: Packet socket created in container
      exceptions:
        - name: kube_vip_arp
          fields:
            - k8s.ns.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
            - evt.arg.type
            - evt.arg.proto
          comps: [=, =, =, =, =, =, =]
          values:
            - - kube-system
              - ghcr.io/kube-vip/kube-vip
              - kube-vip
              - kube-vip
              - /kube-vip
              - 2
              - 1544
      override:
        exceptions: append
