---
apiVersion: instance.falcosecurity.dev/v1alpha1
kind: Component
metadata:
  name: falcosidekick
spec:
  component:
    type: falcosidekick
  replicas: 1
  podTemplateSpec:
    spec:
      containers:
        - name: falcosidekick
          image: docker.io/falcosecurity/falcosidekick:2.35.1@sha256:a9bb60d2c7742febd912315ca1155839abc0199bf322c58d3adbb8b0849fadb9
          env:
            - name: ALERTMANAGER_HOSTPORT
              value: http://vmalertmanager-victoria-metrics.observability.svc.cluster.local:9093
            - name: ALERTMANAGER_ENDPOINT
              value: /api/v2/alerts
            - name: WEBUI_URL
              value: http://falcosidekick-ui:2802
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: instance.falcosecurity.dev/v1alpha1
kind: Component
metadata:
  name: falcosidekick-ui
spec:
  component:
    type: falcosidekick-ui
  replicas: 1
  podTemplateSpec:
    spec:
      containers:
        - name: falcosidekick-ui
          env:
            - name: FALCOSIDEKICK_UI_USER
              valueFrom:
                secretKeyRef:
                  name: falcosidekick-ui-auth
                  key: user
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: instance.falcosecurity.dev/v1alpha1
kind: Component
metadata:
  name: metacollector
spec:
  component:
    type: metacollector
  replicas: 1
