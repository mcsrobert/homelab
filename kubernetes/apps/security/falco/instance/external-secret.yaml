---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name falcosidekick-ui-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: *name
    template:
      data:
        user: "{{ .USERNAME }}:{{ .PASSWORD }}"
  data:
    - secretKey: USERNAME
      remoteRef:
        key: falco/sidekick-ui
        property: USERNAME
    - secretKey: PASSWORD
      remoteRef:
        key: falco/sidekick-ui
        property: PASSWORD
