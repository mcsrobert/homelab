---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: falco-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # The artifact operator reconciles rules and other artifacts.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: falco_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
          comps: [=, startswith, =, =, =]
          values:
            - - security
              - falco-
              - docker.io/falcosecurity/artifact-operator
              - artifact-operator
              - /usr/bin/manager
      override:
        exceptions: append
