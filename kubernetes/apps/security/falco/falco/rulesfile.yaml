---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: falco-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # The artifact operator reconciles rules and other artifacts.
    - macro: k8s_containers
      override:
        condition: append
      condition: >
        or (container.image.repository = "docker.io/falcosecurity/artifact-operator" and k8s.ns.name = "security" and container.name = "artifact-operator" and k8s.pod.name startswith "falco-" and proc.exepath = "/usr/bin/manager")
