---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: falco-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: /kubernetes/apps/security/falco/operator
  targetNamespace: security
  interval: 30m
  timeout: 5m
  wait: true
  prune: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: falco-dragonfly
  namespace: flux-system
spec:
  dependsOn:
    - name: dragonfly-operator
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: /kubernetes/apps/security/falco/dragonfly
  targetNamespace: &namespace security
  interval: 30m
  timeout: 5m
  prune: true
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: falcosidekick-ui-redis
      namespace: *namespace
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: falco
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
    - name: falco-dragonfly
    - name: falco-operator
    - name: gateway-api-crds
    - name: prometheus-operator-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: /kubernetes/apps/security/falco/instance
  targetNamespace: security
  interval: 30m
  timeout: 5m
  wait: true
  prune: true
  healthCheckExprs:
    - apiVersion: instance.falcosecurity.dev/v1alpha1
      kind: Falco
      current: has(status.conditions) && status.conditions.exists(e, e.type == 'Available' && e.status == 'True')
    - apiVersion: instance.falcosecurity.dev/v1alpha1
      kind: Component
      current: has(status.conditions) && status.conditions.exists(e, e.type == 'Available' && e.status == 'True')
