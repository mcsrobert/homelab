---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao-rotation-exporter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: openbao-rotation-exporter
  values: # https://github.com/mcsrobert/openbao-rotation-exporter/blob/main/charts/openbao-rotation-exporter/README.md
    config:
      openbao:
        address: https://bao.${CLUSTER_DOMAIN}
        mount: homelab
        auth:
          kubernetes:
            role: openbao-rotation-exporter
            jwtFile: /var/run/secrets/openbao/token
      keys:
        tailscale/auth-keys/t3-code: 80d
        tailscale/auth-keys/home-lan-router: 80d
    serviceAccount:
      automount: false
    extraVolumes:
      - name: openbao-token
        projected:
          sources:
            - serviceAccountToken:
                path: token
                audience: openbao
                expirationSeconds: 600
    extraVolumeMounts:
      - name: openbao-token
        mountPath: /var/run/secrets/openbao
        readOnly: true
    networkPolicy:
      enabled: true
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
