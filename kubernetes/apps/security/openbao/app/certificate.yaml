---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ca
spec:
  isCA: true
  commonName: Homelab OpenBao CA
  secretName: openbao-ca
  duration: 87600h # 10y
  privateKey:
    algorithm: ECDSA
    size: 384
  issuerRef:
    kind: Issuer
    name: openbao-selfsigned
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-internal-cert
spec:
  # External Secrets needs this private CA certificate to fetch the Cloudflare token for Let's Encrypt.
  secretName: openbao-internal-tls
  dnsNames:
    - localhost
    - openbao
    - openbao.security
    - openbao.security.svc
    - openbao.security.svc.cluster.local
  ipAddresses:
    - 127.0.0.1
    - ::1
  issuerRef:
    kind: Issuer
    name: openbao-ca
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-cert
  annotations:
    # The placeholder lets OpenBao start and supply the Cloudflare token.
    # cert-manager reports it as Ready. Use cmctl renew to retry failed issuance early.
    cert-manager.io/issue-temporary-certificate: "true"
spec:
  secretName: openbao-tls
  commonName: &domain bao.${CLUSTER_DOMAIN}
  dnsNames:
    - *domain
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
