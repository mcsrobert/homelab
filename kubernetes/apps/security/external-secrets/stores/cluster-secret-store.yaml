---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      # The internal Service, so fetching secrets avoids Traefik and Blocky.
      server: https://openbao.security.svc.cluster.local:8200
      caProvider:
        type: Secret
        namespace: security
        name: openbao-tls
        key: ca.crt
      path: homelab
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-role
          serviceAccountRef:
            name: external-secrets
            namespace: security
