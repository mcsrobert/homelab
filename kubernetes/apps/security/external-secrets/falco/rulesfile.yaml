---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: external-secrets-exceptions
spec:
  priority: 60
  inlineRules:
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: external_secrets_controller_api
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
            - proc.cmdline
          comps: [=, startswith, =, =, =, =, =]
          values:
            - - security
              - external-secrets-
              - ghcr.io/external-secrets/external-secrets
              - external-secrets
              - external-secret
              - /usr/bin/external-secrets
              - "external-secret --concurrent=1 --metrics-addr=:8080 --loglevel=info --zap-time-encoding=epoch"
        - name: external_secrets_cert_controller_api
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
            - proc.cmdline
          comps: [=, startswith, =, =, =, =, startswith]
          values:
            - - security
              - external-secrets-cert-controller-
              - ghcr.io/external-secrets/external-secrets
              - cert-controller
              - external-secret
              - /usr/bin/external-secrets
              - "external-secret certcontroller "
      override:
        exceptions: append
