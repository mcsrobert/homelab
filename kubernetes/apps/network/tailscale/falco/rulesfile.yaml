---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: tailscale-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # TS_KUBE_SECRET makes containerboot and tailscaled manage Kubernetes state.
    # https://tailscale.com/docs/features/containers/docker/docker-params#ts_kube_secret
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: tailscale_state_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
            - proc.pname
            - user.uid
            - evt.type
            - fd.l4proto
            - fd.rport
          comps: [=, startswith, =, =, =, =, =, =, =, =, =]
          values:
            - - network
              - tailscale-
              - ghcr.io/tailscale/tailscale
              - tailscale
              - containerboot
              - /usr/local/bin/containerboot
              - containerd-shim
              - 0
              - connect
              - tcp
              - 443
            - - network
              - tailscale-
              - ghcr.io/tailscale/tailscale
              - tailscale
              - tailscaled
              - /usr/local/bin/tailscaled
              - containerboot
              - 0
              - connect
              - tcp
              - 443
      override:
        exceptions: append
