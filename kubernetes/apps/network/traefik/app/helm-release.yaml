---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  chartRef:
    kind: OCIRepository
    name: traefik
  interval: 30m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values: # https://github.com/traefik/traefik-helm-chart/blob/master/traefik/VALUES.md#values
    providers:
      kubernetesCRD:
        allowCrossNamespace: true  # needed for ForwardAuth and network-*@kubernetescrd chains
      kubernetesGateway:
        enabled: true
    deployment:
      replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: '{{ template "traefik.name" . }}'
            app.kubernetes.io/instance: '{{ .Release.Name }}-{{ include "traefik.namespace" . }}'
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    service:
      annotations:
        metallb.io/loadBalancerIPs: "${PROXY_IP},${PROXY_IPv6}"
      spec:
        type: LoadBalancer
        ipFamilyPolicy: RequireDualStack
        externalTrafficPolicy: Local
    ports:
      web:
        port: &webPort 8000
        expose:
          default: true
        exposedPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        port: &websecurePort 8443
        expose:
          default: true
        exposedPort: 443
        http:
          middlewares:
            - network-chain@kubernetescrd
        http3:
          enabled: true
        forwardedHeaders: &trustedIPs
          trustedIPs:
            - ${LAN_CIDR}
            - ${LAN_CIDRv6}
            - ${CLUSTER_CIDR}
            - ${CLUSTER_CIDRv6}
        proxyProtocol: *trustedIPs
    gateway:
      listeners:
        web:
          port: *webPort
          protocol: HTTP
          namespacePolicy:
            from: All
        websecure:
          port: *websecurePort
          protocol: HTTPS
          namespacePolicy:
            from: All
          certificateRefs:
            - name: ${CLUSTER_DOMAIN/./-}-tls
          mode: Terminate
    metrics:
      prometheus:
        addRoutersLabels: true
        addServicesLabels: true
        disableAPICheck: true  # required for flux-local
        # Dedicated metrics Service: the metrics port is not exposed on the traefik Service
        service:
          enabled: true
        serviceMonitor:
          enabled: true
          # Name the job after the chart's app label (traefik), not the metrics Service (traefik-metrics)
          jobLabel: app.kubernetes.io/name
        prometheusRule:
          enabled: true
          rules:
            - alert: TraefikDown
              expr: absent(up{job="traefik", namespace="network"} == 1)
              for: 3m
              labels:
                severity: critical
              annotations:
                summary: >-
                  Traefik is down
                description: >-
                  No Traefik replica has been scraped successfully for 3 minutes. Every
                  HTTPRoute and ForwardAuth-protected service is likely unreachable.
            # Traefik's `service` metric label clashes with the scrape target's `service` label
            # and is exported as `exported_service`. Traefik itself answers 5xx when a backend
            # has no ready endpoints, so this also catches apps that are down behind it.
            - alert: TraefikServiceHighErrorRate
              expr: |
                (
                  sum by (exported_service) (rate(traefik_service_requests_total{code=~"5.."}[10m]))
                  /
                  sum by (exported_service) (rate(traefik_service_requests_total[10m]))
                  > 0.25
                )
                and
                sum by (exported_service) (increase(traefik_service_requests_total{code=~"5.."}[10m])) >= 10
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: >-
                  Traefik service {{ $labels.exported_service }} returns many 5xx responses
                description: >-
                  {{ $value | humanizePercentage }} of the requests to
                  {{ $labels.exported_service }} failed with a 5xx status over the last 10 minutes.
