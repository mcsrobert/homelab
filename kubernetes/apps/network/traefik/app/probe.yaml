---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: traefik-wildcard-ipv4
spec:
  jobName: traefik-wildcard-ipv4
  prober:
    url: blackbox-exporter.observability.svc:9115
  module: tls_connect_ipv4
  interval: 60s
  scrapeTimeout: 10s
  targets:
    staticConfig:
      static:
        # No route uses this name. Blocky resolves every name under the domain to Traefik, and
        # as the SNI it selects the wildcard certificate.
        - traefik.${CLUSTER_DOMAIN}:443
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: traefik-wildcard-ipv6
spec:
  jobName: traefik-wildcard-ipv6
  prober:
    url: blackbox-exporter.observability.svc:9115
  module: tls_connect_ipv6
  interval: 60s
  scrapeTimeout: 10s
  targets:
    staticConfig:
      static:
        - traefik.${CLUSTER_DOMAIN}:443
