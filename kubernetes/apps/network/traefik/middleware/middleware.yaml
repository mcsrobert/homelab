---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/traefik.io/middleware_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secure-headers
spec:
  headers:
    contentTypeNosniff: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    customResponseHeaders:
      Server: ""
      X-Powered-By: ""
      X-Permitted-Cross-Domain-Policies: none
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/traefik.io/middleware_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
spec:
  compress:
    minResponseBodyBytes: 1024
    includedContentTypes:
      - text/html
      - text/css
      - text/plain
      - text/xml
      - text/javascript
      - application/javascript
      - application/json
      - application/xml
      - application/wasm
      - image/svg+xml
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/traefik.io/middleware_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-authelia
spec:
  forwardAuth:
    address: http://authelia.auth.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: true
    maxBodySize: 1048576  # 1MB
    maxResponseBodySize: 1048576  # 1MB
    authResponseHeaders:
      - Remote-User
      - Remote-Name
      - Remote-Email
      - Remote-Groups
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/traefik.io/middleware_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: chain
spec:
  chain:
    middlewares:
      - name: secure-headers
      - name: compress
