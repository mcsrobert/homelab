---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/fluxcd.controlplane.io/resourceset_v1.json
# HTTPRoute ExtensionRefs require a copy of the middleware in each namespace.
# https://github.com/kubernetes-sigs/gateway-api/discussions/4340
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: middleware-per-namespace
spec:
  inputs:
    - namespace: default
    - namespace: flux-system
    - namespace: home-automation
    - namespace: kyverno
    - namespace: longhorn-system
    - namespace: media
    - namespace: network
    - namespace: observability
    - namespace: security
  resources:
    - apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: auth-chain
        namespace: << inputs.namespace >>
      spec:
        chain:
          middlewares:
            - name: network-forwardauth-authelia@kubernetescrd
