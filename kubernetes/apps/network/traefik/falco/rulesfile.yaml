---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: traefik-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # Traefik watches Gateway API and other routing resources.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: traefik_api_clients
          fields:
            - container.image.repository
            - k8s.ns.name
            - container.name
            - proc.exepath
            - k8s.pod.name
          comps: [=, =, =, =, startswith]
          values:
            - - docker.io/library/traefik
              - network
              - traefik
              - /usr/local/bin/traefik
              - traefik-
      override:
        exceptions: append
