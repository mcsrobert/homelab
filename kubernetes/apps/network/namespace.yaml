---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.2-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: network
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # Pod Security Admission, warn/audit only (nothing is rejected). Some workloads
    # here are privileged or use hostPath on purpose, so a warning flags what goes
    # beyond baseline.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
