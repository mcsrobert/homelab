---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.2-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # Privileged or hostPath workloads in this namespace preclude baseline enforcement.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
