---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 6020
            runAsGroup: 65537
            fsGroup: 65537
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          radarr:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.1.10859@sha256:ffe1f4d7c30b33a1e1256e14ace0eefddf120b37d8defceba208e9c190772f8d
            env:  # See: https://wiki.servarr.com/radarr/environment-variables
              TZ: ${TIME_ZONE}
              RADARR__APP__INSTANCENAME: "{{ .Release.Name }}"
              RADARR__APP__THEME: dark
              RADARR__APPLICATION_URL: https://{{ .Release.Name }}.${CLUSTER_DOMAIN}
              RADARR__AUTH__REQUIRED: Enabled
              RADARR__LOG__LEVEL: info
              RADARR__LOG__ANALYTICSENABLED: false
              RADARR__SERVER__PORT: &port 8080
              RADARR__UPDATE__BRANCH: develop
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 768Mi
              limits:
                memory: 1.5Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        existingClaim: radarr-config
      media:
        type: nfs
        server: ${NAS_IP}
        path: /volume1/media
      tmp:
        type: emptyDir
    service:
      radarr:
        ports:
          http:
            port: *port
    route:
      radarr:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Radarr
          gethomepage.dev/icon: radarr
          gethomepage.dev/description: Movie organizer & manager
          gethomepage.dev/group: Media
          gethomepage.dev/widget.type: radarr
          gethomepage.dev/widget.url: https://{{ .Release.Name }}.${CLUSTER_DOMAIN}
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_RADARR_API_KEY}}` }}"
        hostnames:
          - "{{ .Release.Name }}.${CLUSTER_DOMAIN}"
        parentRefs:
          - name: traefik-gateway
            namespace: network
            sectionName: websecure
    networkpolicies:
      radarr:
        controller: radarr
        policyTypes:
          - Ingress
        rules:
          ingress:
            # Traefik serves the route. The other media apps call the API directly.
            - from:
                - podSelector: {}
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: network
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: traefik
              ports:
                - port: *port
