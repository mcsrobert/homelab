---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  # Downgrades require restoring data from a backup after startup migrations.
  # https://jellyfin.org/docs/general/administration/backup-and-restore/
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: false
  values:
    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 6100
            runAsGroup: 65537  # media
            fsGroup: 65537
            fsGroupChangePolicy: OnRootMismatch
        containers:
          jellyfin:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
              readiness: *probe
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 6Gi
                devic.es/vpu: "1"
            securityContext:
              # Rockchip hardware acceleration requires privileged mode on these nodes.
              # https://jellyfin.org/docs/general/post-install/transcoding/hardware-acceleration/rockchip/#linux-setups
              privileged: true
    persistence:
      config:
        type: persistentVolumeClaim
        forceRename: &configVolume jellyfin-config
        retain: true
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 8Gi
        volumeName: *configVolume
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: ${NAS_IP}
        path: /volume1/media
        globalMounts:
          - path: /media
      # Transcode scratch space also lives under /cache.
      tmpfs:
        type: emptyDir
        sizeLimit: 20Gi
        globalMounts:
          - path: /cache
      libmali:
        type: hostPath
        hostPath: /usr/lib/aarch64-linux-gnu/libmali.so.1.9.0
        hostPathType: File
        globalMounts:
          - path: /usr/lib/aarch64-linux-gnu/libmali.so
            readOnly: true
    service:
      jellyfin:
        ports:
          http:
            port: *port
    route:
      jellyfin:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Jellyfin
          gethomepage.dev/icon: jellyfin
          gethomepage.dev/description: Open-source Media Server
          gethomepage.dev/group: Media
          gethomepage.dev/widget.type: jellyfin
          gethomepage.dev/widget.version: "2"
          gethomepage.dev/widget.url: https://{{ .Release.Name }}.${CLUSTER_DOMAIN}
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}` }}"
          gethomepage.dev/widget.enableBlocks: "true"
          gethomepage.dev/widget.enableNowPlaying: "false"
          gethomepage.dev/widget.enableMediaControl: "false"
        hostnames:
          - "{{ .Release.Name }}.${CLUSTER_DOMAIN}"
        parentRefs:
          - name: traefik-gateway
            namespace: network
            sectionName: websecure
    networkpolicies:
      jellyfin:
        controller: jellyfin
        policyTypes:
          - Ingress
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: network
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: traefik
              ports:
                - port: *port
