---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: t3-code-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # T3 Code runs kubectl for troubleshooting (PR #1253, Nov 6 Falco events).
    - rule: Contact K8S API Server From Container
      exceptions:
        # Match mise-installed kubectl across tool upgrades.
        - name: t3_code_kubectl_api
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.name
            - proc.exepath
          comps: [=, startswith, =, =, =, glob]
          values:
            - - development
              - t3-code-
              - ghcr.io/mcsrobert/t3-code
              - t3-code
              - kubectl
              - /home/node/.local/share/mise/installs/kubectl/*/kubectl
        # Disabled: PR #1253 allowed flux by name, without a captured executable.
        # Re-enable only after an API event establishes its process identity.
        # - name: t3_code_flux_api
        #   fields:
        #     - k8s.ns.name
        #     - k8s.pod.name
        #     - container.image.repository
        #     - container.name
        #     - proc.name
        #   comps: [=, startswith, =, =, =]
        #   values:
        #     - - development
        #       - t3-code-
        #       - ghcr.io/mcsrobert/t3-code
        #       - t3-code
        #       - flux
      override:
        exceptions: append
