---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: t3-code-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # T3 Code (development) runs read-only kubectl and flux commands for troubleshooting.
    - macro: k8s_containers
      override:
        condition: append
      condition: >
        or (container.name = "t3-code" and k8s.ns.name = "development" and proc.name in ("kubectl", "flux") and container.image.repository = "docker.io/library/node" and k8s.pod.name startswith "t3-code-")
