---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values: # https://github.com/mogenius/renovate-operator/blob/main/charts/renovate-operator/values.yaml
    fullnameOverride: renovate-operator
    image:
      registry: ghcr.io
      repository: mogenius/renovate-operator
      tag: 6.5.1@sha256:892eec306b8ad0040046328ac7ed47fdcd28946e6e26fc9911f2d6d6c6055c70
    crd:
      image:
        registry: registry.k8s.io
        repository: kubectl
        tag: v1.37.1@sha256:b7cab618e281b1ee7484e7b706a96e2135fbb6e072c2a573a7dab4e87d7f2385
    webhook:
      enabled: true
    auth:
      oidc:
        enabled: true
        issuerUrl: https://authelia.${CLUSTER_DOMAIN}
        redirectUrl: https://renovate.${CLUSTER_DOMAIN}/auth/callback
        clientId: renovate-operator
        existingSecret: renovate-operator-oidc
        additionalScopes:
          - groups
        fetchUserInfoGroups: true
    authorization:
      defaults:
        adminGroups:
          - id_admin
    valkey:
      enabled: true
      image:
        registry: docker.io
        repository: valkey/valkey
        tag: 9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
      auth:
        enabled: false
      metrics:
        enabled: false
        serviceMonitor:
          enabled: false
    route:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Renovate Operator
        gethomepage.dev/icon: renovate
        gethomepage.dev/description: Streamline Renovate executions in Kubernetes
        gethomepage.dev/group: Development
        gethomepage.dev/pod-selector: app=renovate-operator
      hostnames:
        - renovate.${CLUSTER_DOMAIN}
      parentRefs:
        - name: traefik-gateway
          namespace: network
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
        annotations:
          grafana_folder: development
