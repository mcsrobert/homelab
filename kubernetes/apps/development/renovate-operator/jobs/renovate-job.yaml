---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-github
spec:
  image: renovate/renovate:44.264.1@sha256:35777dd4aa87beee05ba64c7728a2c5e3c70687fdb654909710bac93c697efd1
  extraEnv:
    - name: RENOVATE_X_GITHUB_HOST_RULES
      value: "true"
    # Cache GHCR tags so pagination can fall back to the last good list on a 429.
    - name: RENOVATE_CACHE_PRIVATE_PACKAGES
      value: "true"
  provider:
    name: github
  # Offset from the hour to avoid GHCR's rate-limit burst on immich-app.
  schedule: 37 * * * *
  parallelism: 1
  secretRef: renovate-github-token
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1Gi
