---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-github
spec:
  image: renovate/renovate:44.174.0@sha256:1d257740562b9533894202caecb07fa3709bc818d33068185c5a58e5126b26c3
  extraEnv:
    - name: RENOVATE_X_GITHUB_HOST_RULES
      value: "true"
    # Renovate only caches Docker Hub tags by default; enable Valkey caching for
    # ghcr.io too so mid-pagination 429s can fall back to the last good tag list.
    - name: RENOVATE_CACHE_PRIVATE_PACKAGES
      value: "true"
  provider:
    name: github
  # Offset from :00 to avoid the top-of-the-hour GHCR burst on immich-app's
  # shared 44,000 req/min rate-limit bucket.
  schedule: 37 * * * *
  parallelism: 1
  secretRef: renovate-github-token
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1Gi
