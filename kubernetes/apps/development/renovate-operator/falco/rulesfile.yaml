---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: renovate-operator-api-exceptions
spec:
  priority: 60
  inlineRules:
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: renovate_operator_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
          comps: [=, startswith, =, =, =]
          values:
            - - development
              - renovate-operator-
              - ghcr.io/mogenius/renovate-operator
              - renovate-operator
              - /app/renovate-operator
      override:
        exceptions: append
    # The chart installs its CRDs through a Helm hook.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: renovate_operator_crd_install_api
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
            - proc.args
          comps: [=, startswith, =, =, =, =]
          values:
            - - development
              - renovate-operator-crd-install-
              - registry.k8s.io/kubectl
              - kubectl
              - /bin/kubectl
              - apply --server-side --force-conflicts -f /crd
      override:
        exceptions: append
    # Containerbase installs Node and npm into versioned paths for lockfile regeneration.
    - rule: Drop and execute new binary in container
      exceptions:
        - name: renovate_homelab_npm
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
            - proc.pname
            - proc.sname
            - proc.aname[2]
            - user.uid
            - proc.cwd
            - proc.cmdline
          comps: [=, startswith, =, =, glob, =, =, =, =, =, glob]
          values:
            - - &renovate_ns development
              - &renovate_pod renovate-github-mcsrobert-homelab-
              - &renovate_image docker.io/renovate/renovate
              - &renovate_container renovate
              - &renovate_node /opt/containerbase/tools/node/*/bin/node
              - node
              - install-tool
              - npm
              - &renovate_uid 12021
              - /tmp/
              - node /opt/containerbase/tools/node/*/bin/npm --version
            - - *renovate_ns
              - *renovate_pod
              - *renovate_image
              - *renovate_container
              - *renovate_node
              - node
              - install-tool
              - install-tool
              - *renovate_uid
              - /opt/containerbase/
              - >-
                node /opt/containerbase/tools/node/*/bin/npm install npm@*
                --save-exact --no-audit --prefix /opt/containerbase/tools/npm/*/*
                --cache /tmp/containerbase-npm-?????? -d
            - - *renovate_ns
              - *renovate_pod
              - *renovate_image
              - *renovate_container
              - *renovate_node
              - node
              - install-tool
              - npm
              - *renovate_uid
              - /tmp/
              - node /opt/containerbase/tools/npm/*/*/bin/npm --version
            - - *renovate_ns
              - *renovate_pod
              - *renovate_image
              - *renovate_container
              - *renovate_node
              - node
              - npm
              - npm
              - *renovate_uid
              - /tmp/repos/github/mcsrobert/homelab/containers/t3-code/
              - >-
                node /opt/containerbase/tools/npm/*/*/bin/npm install
                --package-lock-only --no-audit --ignore-scripts
      override:
        exceptions: append
