---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: renovate-operator-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # Renovate operator schedules and manages Renovate jobs.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: renovate_operator_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
          comps: [=, startswith, =, =, =]
          values:
            - - development
              - renovate-operator-
              - ghcr.io/mogenius/renovate-operator
              - renovate-operator
              - /app/renovate-operator
      override:
        exceptions: append
    # The chart's pre-install/pre-upgrade hook applies its CRDs to the API server.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: renovate_operator_crd_install_api
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
            - proc.args
          comps: [=, startswith, =, =, =, =]
          values:
            - - development
              - renovate-operator-crd-install-
              - registry.k8s.io/kubectl
              - kubectl
              - /bin/kubectl
              - apply --server-side --force-conflicts -f /crd
      override:
        exceptions: append
