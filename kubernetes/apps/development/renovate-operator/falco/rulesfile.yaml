---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: renovate-operator-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # Renovate operator schedules and manages Renovate jobs.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: renovate_operator_api_clients
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
          comps: [=, startswith, =, =, =]
          values:
            - - development
              - renovate-operator-
              - ghcr.io/mogenius/renovate-operator
              - renovate-operator
              - /app/renovate-operator
      override:
        exceptions: append
    # The chart's pre-install/pre-upgrade hook applies its CRDs to the API server.
    - rule: Contact K8S API Server From Container
      exceptions:
        - name: renovate_operator_crd_install_api
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
            - proc.args
          comps: [=, startswith, =, =, =, =]
          values:
            - - development
              - renovate-operator-crd-install-
              - registry.k8s.io/kubectl
              - kubectl
              - /bin/kubectl
              - apply --server-side --force-conflicts -f /crd
      override:
        exceptions: append
    # The homelab Renovate job installs Node and npm through Containerbase
    # before regenerating the T3 Code lockfile.
    - rule: Drop and execute new binary in container
      exceptions:
        - name: renovate_homelab_npm
          fields:
            - k8s.ns.name
            - k8s.pod.name
            - container.image.repository
            - container.name
            - proc.exepath
            - proc.pname
            - proc.sname
            - proc.aname[2]
            - user.uid
            - proc.cwd
            - proc.cmdline
          comps: [=, startswith, =, =, =, =, =, =, =, =, glob]
          values:
            - - development
              - renovate-github-mcsrobert-homelab-
              - docker.io/renovate/renovate
              - renovate
              - /opt/containerbase/tools/node/26.13.1/bin/node
              - node
              - install-tool
              - npm
              - &renovate_uid 12021
              - /tmp/
              - node /opt/containerbase/tools/node/26.13.1/bin/npm --version
            - - development
              - renovate-github-mcsrobert-homelab-
              - docker.io/renovate/renovate
              - renovate
              - /opt/containerbase/tools/node/26.13.1/bin/node
              - node
              - install-tool
              - install-tool
              - *renovate_uid
              - /opt/containerbase/
              - >-
                node /opt/containerbase/tools/node/26.13.1/bin/npm install npm@12.2.3
                --save-exact --no-audit --prefix /opt/containerbase/tools/npm/12.2.3/26.13.1
                --cache /tmp/containerbase-npm-?????? -d
            - - development
              - renovate-github-mcsrobert-homelab-
              - docker.io/renovate/renovate
              - renovate
              - /opt/containerbase/tools/node/26.13.1/bin/node
              - node
              - npm
              - npm
              - *renovate_uid
              - /tmp/repos/github/mcsrobert/homelab/containers/t3-code/
              - >-
                node /opt/containerbase/tools/npm/12.2.3/26.13.1/bin/npm install
                --package-lock-only --no-audit --ignore-scripts
      override:
        exceptions: append
