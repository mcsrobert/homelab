---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: renovate-operator-api-exceptions
spec:
  # Load after the upstream falco-rules (priority 50).
  priority: 60
  inlineRules:
    # Renovate operator schedules and manages Renovate jobs.
    - macro: k8s_containers
      override:
        condition: append
      condition: >
        or (container.image.repository = "ghcr.io/mogenius/renovate-operator" and k8s.ns.name = "development" and container.name = "renovate-operator" and proc.exepath = "/app/renovate-operator" and k8s.pod.name startswith "renovate-operator-")
    # The chart's pre-install/pre-upgrade hook applies its CRDs to the API server.
    - macro: k8s_containers
      override:
        condition: append
      condition: >
        or (container.image.repository = "registry.k8s.io/kubectl" and k8s.ns.name = "development" and container.name = "kubectl" and proc.exepath = "/bin/kubectl" and proc.args = "apply --server-side --force-conflicts -f /crd" and k8s.pod.name startswith "renovate-operator-crd-install-")
