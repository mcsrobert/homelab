---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-operator
spec:
  groups:
    - name: flux.operator
      rules:
        # Reconciliation failures are reported by the Flux notification controller (see
        # notifications/). The operator emits the ResourceSet and FluxInstance events, so a
        # dead operator is the one failure that stays silent there.
        - alert: FluxOperatorDown
          expr: absent(up{job="flux-operator", namespace="flux-system"} == 1)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Flux Operator metrics are missing
            description: >-
              The Flux Operator has not been scraped for 15 minutes, so ResourceSet and FluxInstance
              failures are no longer reported. Flux itself keeps reconciling as long as its
              controllers run.
